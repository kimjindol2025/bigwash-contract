  /care/warranty-expiring:
    get:
      summary: "보증 만료 임박 장비 목록 (재구매·교체판매 제안 대상, ACTIVE 장비만)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 3650, default: 30 }
      responses:
        "200": { description: "목록 (최대 50건, equipment.status='ACTIVE'만 포함 — 2026-07-21 2주차 추가)" }
        "400": { description: "days는 0~3650 사이의 정수여야 함" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/ops-summary:
    get:
      summary: "운영 대시보드 집계 — 지연 A/S·일정미정·오늘방문·보증임박 (2주차, 2026-07-21 추가)"
      description: >
        미수금은 포함하지 않는다(PaymentOrder 정의 전 — docs/09 0장 원칙).
        모든 "지금"은 Asia/Seoul로 보정한 값이다(datetime('now','+9 hours')).
        overdue/unscheduled는 status IN (RECEIVED,SCHEDULED)만 대상이며
        IN_PROGRESS는 포함하지 않는다. unscheduled는 "담당자 미배정"이 아니라
        "일정 미정"이다 — service_tickets에 담당자 컬럼이 없고
        service_visits.technician은 방문 완료 후에만 존재하는 사후 이력이라
        배정 여부를 나타낼 수 없다. visits_today는 scheduled_at(예정) 기준이며
        service_visits(완료 이력)를 쓰지 않는다. 상세는 04-washcare-api.md 참조.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: warranty_days
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 3650, default: 30 }
      responses:
        "200":
          description: "집계 결과. 각 섹션은 count(전체 개수)+items(최대 50건)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      as_of: { type: string, format: date-time, example: "2026-07-21T01:00:00+09:00" }
                      timezone: { type: string, example: "Asia/Seoul" }
                      overdue:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsTicketRow" } }
                      unscheduled:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsTicketRow" } }
                      visits_today:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsTicketRow" } }
                      warranty_expiring:
                        type: object
                        properties:
                          count: { type: integer }
                          days: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsEquipmentRow" } }
        "400": { description: "warranty_days must be an integer between 0 and 3650" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/ops-weekly:
    get:
      summary: "주간 운영 보고 — 미처리 A/S·다음 주 방문·보증 만료 기반 점검 대상 (3주차, 2026-07-21)"
      description: >
        docs/01 §6 항목 8(P0-2)의 화면/JSON MVP. 미수금 키·섹션·추정값은
        포함하지 않는다(PaymentOrder/입금원장 도입 후 버전된 API로 추가).
        주차는 ISO 8601(월~일), Asia/Seoul. week.kind는 항상 "next"(as_of가
        속한 ISO 주의 다음 주). visits_next_week는 scheduled_at 예정만 사용하며
        service_visits(완료 이력)를 쓰지 않는다. inspection_due는 ACTIVE 장비의
        warranty_ends_at이 다음 ISO 주에 해당하는 보증 만료 기반 점검 대상이다.
        unprocessed는 status NOT IN (COMPLETED,CANCELLED)이며 IN_PROGRESS를
        포함한다(열린 티켓 전체). "담당자 미배정"이 아니다.
        내부 API는 기본 fail-closed이며 ApiKeyAuth가 필수다.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: as_of
          in: query
          required: false
          description: >
            스냅샷 기준일(Asia/Seoul 달력). YYYY-MM-DD.
            생략 시 서버의 Seoul "오늘". 결정적 테스트·디버그에 사용.
          schema: { type: string, format: date, example: "2026-01-01" }
      responses:
        "200":
          description: >
            집계 결과. 각 섹션은 count(전체)+items(최대 50건).
            receivables/미수금/unassigned 키는 존재하지 않는다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [as_of, timezone, week, unprocessed, visits_next_week, inspection_due]
                    properties:
                      as_of: { type: string, format: date, example: "2026-01-01" }
                      timezone: { type: string, example: "Asia/Seoul" }
                      week:
                        type: object
                        required: [kind, iso_year, iso_week, label, start_date, end_date]
                        properties:
                          kind: { type: string, enum: [next], example: next }
                          iso_year: { type: integer, example: 2026 }
                          iso_week: { type: integer, example: 2 }
                          label: { type: string, example: "2026-W02" }
                          start_date: { type: string, format: date, example: "2026-01-05" }
                          end_date: { type: string, format: date, example: "2026-01-11" }
                      unprocessed:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsTicketRow" } }
                      visits_next_week:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsTicketRow" } }
                      inspection_due:
                        type: object
                        properties:
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/OpsEquipmentRow" } }
        "400": { description: "as_of must be a valid YYYY-MM-DD date" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/care-plans:
    post:
      summary: "연간관리(CarePlan) 가입 생성 (4주차, 2026-07-21 추가)"
      description: >
        site_id 앵커. plan_code TRIAL_90(90일)/BASIC_360(365일)/FIELD_790(365일)
        중 하나이며 기본 가격(99000/360000/790000원)·기본 포함방문(0/0/2)을
        갖는다. price_snapshot/included_visits는 0 이상 정수로만 override
        가능(소수·음수 400). ends_at은 starts_at 포함 계산
        (starts_at + 기간일수 - 1). 같은 site_id에 겹치는 비취소(ACTIVE/
        RENEWED) 기간이 있으면 트랜잭션 내에서 거부. payment_status/PG
        연동 없음(PaymentOrder 도입 전).
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, plan_code]
              properties:
                site_id: { type: integer }
                plan_code: { type: string, enum: [TRIAL_90, BASIC_360, FIELD_790] }
                starts_at: { type: string, format: date, description: "생략 시 Seoul 오늘" }
                price_snapshot: { type: integer, minimum: 0, description: "생략 시 plan_code 기본값" }
                included_visits: { type: integer, minimum: 0, description: "생략 시 plan_code 기본값" }
                next_inspection_at: { type: string, format: date, nullable: true }
                memo: { type: string, nullable: true }
      responses:
        "200":
          description: "생성됨. status는 항상 ACTIVE."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/CarePlanRow" }
        "400": { description: "Site not found | plan_code 오류 | 날짜/가격/횟수 검증 실패 | 겹치는 비취소 기간 존재" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "CarePlan 목록 — site_id/customer_id 둘 다 선택 (4주차, 2026-07-21 추가 / 5주차 무필터 확장)"
      description: >
        site_id/customer_id 둘 다 선택 파라미터다. site_id만 있으면 그
        현장의 CarePlan만(무제한), customer_id만 있으면 그 고객의 모든
        현장을 조인한 CarePlan을(무제한) 반환한다. 둘 다 생략하면 전체
        CarePlan을 starts_at DESC, id DESC 기준 최신 50건까지만 반환한다
        (Admin CarePlan 모듈의 "전체 가입 현황" 화면용, 5주차). 세 경로
        모두 sites/customers를 JOIN해 customer_id/customer_name/site_name을
        각 행에 채운다. site_id/customer_id에 정수가 아니거나 0 이하인
        값을 주면 400 — 생략은 오류가 아니라 무필터 전체 목록으로 처리된다.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: site_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: "선택. 있으면 이 현장의 CarePlan만(무제한) 반환. 정수가 아니거나 0 이하면 400"
        - name: customer_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: "선택. site_id 없이 이 값만 있으면 현장 조인으로 고객의 모든 CarePlan(무제한) 반환. 정수가 아니거나 0 이하면 400"
      responses:
        "200":
          description: "목록 (starts_at DESC, id DESC). site_id/customer_id 둘 다 생략 시 최신 50건 cap"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/CarePlanRow" } }
        "400": { description: "site_id must be an integer | site_id must be greater than 0 | customer_id에 대해서도 동일 — 값을 준 경우에만 발생, 생략은 오류 아님" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/care-plans/{id}:
    get:
      summary: "CarePlan 상세 조회 (4주차, 2026-07-21 추가)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "effective_status 파생 필드 포함"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/CarePlanRow" }
        "404": { description: "Care plan not found" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: "used_visits(절대값)·next_inspection_at·memo 수정 (4주차, 2026-07-21 추가)"
      description: >
        used_visits는 자동 차감 없이 항상 절대값을 받는다(재시도 멱등,
        증가·감소 모두 허용 — 오입력 정정 목적). 0..included_visits 범위를
        벗어나면 400. 대상 CarePlan이 ACTIVE가 아니면 400.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                used_visits: { type: integer, minimum: 0 }
                next_inspection_at: { type: string, format: date, nullable: true }
                memo: { type: string, nullable: true }
      responses:
        "200":
          description: "갱신됨"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/CarePlanRow" }
        "404": { description: "Care plan not found" }
        "400": { description: "Only ACTIVE care plans can be updated | used_visits 범위 초과 | next_inspection_at 오류" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/care-plans/{id}/cancel:
    put:
      summary: "CarePlan 취소 (4주차, 2026-07-21 추가)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memo: { type: string, nullable: true, description: "생략 시 기존 memo 유지" }
      responses:
        "200":
          description: "status=CANCELLED로 갱신됨(하드 삭제 없음)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/CarePlanRow" }
        "404": { description: "Care plan not found" }
        "400": { description: "Only ACTIVE care plans can be cancelled" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/care-plans/{id}/renew:
    post:
      summary: "CarePlan 갱신 — 기존 ACTIVE를 RENEWED로, 신규 행 생성 (4주차, 2026-07-21 추가)"
      description: >
        quotes→contracts 전환과 동일한 트랜잭션 오케스트레이션(BEGIN/COMMIT/
        ROLLBACK). starts_at 생략 시 원본 ends_at 다음날로 계산해 조기
        갱신이라도 항상 원본 종료일 기준이라 겹치지 않는다. plan_code 생략
        시 원본 코드를 재사용하되 price_snapshot/included_visits는 원본 값이
        아니라 (재사용/변경된) plan_code의 기본값을 새로 적용하며, 새 행의
        used_visits는 0부터 다시 시작한다.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code: { type: string, enum: [TRIAL_90, BASIC_360, FIELD_790], description: "생략 시 원본과 동일" }
                starts_at: { type: string, format: date, description: "생략 시 원본 ends_at 다음날" }
                price_snapshot: { type: integer, minimum: 0 }
                included_visits: { type: integer, minimum: 0 }
      responses:
        "200":
          description: "새로 생성된 ACTIVE CarePlan (renewed_from_id로 원본 연결)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/CarePlanRow" }
        "404": { description: "Care plan not found" }
        "400": { description: "Only ACTIVE care plans can be renewed | 겹치는 비취소 기간 존재" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/sites:
    get:
      summary: 세차장 운영 사업장 목록
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      responses:
        "200": { description: "OPERATING 사업장 목록" }
