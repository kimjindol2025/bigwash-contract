      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200": { description: 차량명·자동 크기·기준 출처 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/vehicles:
    post:
      summary: 차량번호 중심 작업 기록
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, job_date, plate_number]
              properties:
                site_id: { type: integer }
                job_date: { type: string, format: date }
                plate_number: { type: string }
                vehicle_model: { type: string, nullable: true, description: 생략 시 같은 차량번호의 최근 차량명을 재사용한다. }
                vehicle_size: { type: string, nullable: true, enum: [경형, 소형, 중형, SUV, 대형, 승합], description: 생략 시 최근 차량 이력 또는 차량명 기준 DB로 자동 판정한다. }
                manual_size_override: { type: boolean, default: false, description: 현장에서 차량 크기를 직접 수정한 경우에만 true. true일 때만 차량명 기준 DB가 HISTORY로 학습한다. }
                work_minutes: { type: integer, minimum: 0 }
                wait_minutes: { type: integer, minimum: 0 }
                payment_amount: { type: number, minimum: 0 }
                owner_involved: { type: boolean }
                conditions:
                  type: array
                  description: 확인한 차량 상태 항목만 보낸다. 차량 본문과 한 트랜잭션으로 저장된다.
                  items:
                    type: object
                    required: [inspection_stage, area_group, checkpoint_code, checkpoint_label, condition_status]
                    properties:
                      inspection_stage: { type: string, enum: [ARRIVAL, FINAL] }
                      area_group: { type: string, enum: [EXTERIOR, INTERIOR] }
                      checkpoint_code: { type: string }
                      checkpoint_label: { type: string }
                      condition_status: { type: string, enum: [NORMAL, CONTAMINATED, WET_ODOR, DAMAGE, RECHECK, NOT_APPLICABLE] }
                      note: { type: string, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: 잘못된 요청 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/vehicles/{id}:
    get:
      summary: 차량 CRM 카드와 전체 사업장 방문·상태·재작업 이력
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 차량 기본정보·누적 지표·방문 타임라인·상태·재작업 }
        "400": { description: 존재하지 않는 차량 또는 잘못된 ID }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/reworks:
    post:
      summary: 고객 불만·무료 재작업과 원인 기록
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, occurred_date, plate_number, complaint_area, cause]
              properties:
                site_id: { type: integer }
                vehicle_job_id: { type: integer, nullable: true }
                occurred_date: { type: string, format: date }
                plate_number: { type: string }
                complaint_area: { type: string }
                cause: { type: string, enum: [REQUEST_MISSED, WORK_STEP_MISSED, INSPECTION_MISSED, TIME_SHORTAGE, EXTRA_CONTAMINATION, EQUIPMENT, EXPLANATION_MISMATCH, OTHER] }
                free_minutes: { type: integer, minimum: 0 }
                prevention_action: { type: string, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: 잘못된 요청 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/equipment-issues:
    post:
      summary: 장비 이상과 영업 중단시간 기록
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, occurred_date, issue_title]
              properties:
                site_id: { type: integer }
                equipment_id: { type: integer, nullable: true }
                occurred_date: { type: string, format: date }
                issue_title: { type: string }
                state: { type: string, enum: [OBSERVE, STOPPED, REPAIR_REQUESTED, RESOLVED] }
                downtime_minutes: { type: integer, minimum: 0 }
      responses:
        "200": { description: 생성됨 }
        "400": { description: 잘못된 요청 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/equipment-issues/{id}/resolve:
    put:
      summary: 장비 이상 해결 처리
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 해결됨 }
        "400": { description: 존재하지 않는 기록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/notes:
    post:
      summary: 운영 메모 원문 기록
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, note_date, content]
              properties:
                site_id: { type: integer }
                note_date: { type: string, format: date }
                content: { type: string }
                category: { type: string, enum: [UNSORTED, STAFF, EQUIPMENT, FLOW, CUSTOMER, PRICE, BOOKING, REWORK, IDEA] }
      responses:
        "200": { description: 생성됨 }
        "400": { description: 잘못된 요청 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/dashboard:
    get:
      summary: 사업장·날짜별 문제 중심 운영 대시보드
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      parameters:
        - { name: site_id, in: query, required: true, schema: { type: integer } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: "지표, 원본 목록, 기록 기반 브리핑" }
        "400": { description: 잘못된 사업장 또는 날짜 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/operations/weekly:
    get:
      summary: 기준일 포함 최근 7일 세차장 운영 리포트
      security: [{ApiKeyAuth: []}, {AdminBasicAuth: []}]
      parameters:
        - { name: site_id, in: query, required: true, schema: { type: integer } }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: "주간 지표, 재작업 원인, 일별 작업 흐름" }
        "400": { description: 잘못된 사업장 또는 날짜 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/site-status/{token}:
    get:
      summary: "장비관리 링크 공개 조회 (인증 없음, 고객용, 티켓과 무관하게 지속됨)"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "유효 토큰. 계약금액·이메일·A/S이력 상세는 포함하지 않음."
          headers:
            Cache-Control: { schema: { type: string, example: "no-store" } }
        "404":
          description: "존재하지 않거나 폐기됨"
          headers:
            Cache-Control: { schema: { type: string, example: "no-store" } }
        "429":
          description: "분당 요청 제한 초과"
          headers:
            Cache-Control: { schema: { type: string, example: "no-store" } }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        BIGWASH_INTERNAL_API_KEY 환경변수 값. 미설정·공백이면 내부 API는
        기본 401(fail-closed)이다. 오직 로컬 개발자가
        BIGWASH_ALLOW_INSECURE_DEV=1을 명시한 경우에만 데이터 API의 무키
        접근을 허용한다. 운영에서는 이 예외 값을 금지한다. 정책 상세는
        04-washcare-api.md "인증" 절 참조.
    AdminBasicAuth:
      type: http
      scheme: basic
      description: >
        /care/operations 화면과 같은 출처의 운영 API에만 허용한다.
        BIGWASH_ADMIN_BASIC_AUTH가 미설정·공백이면 기본 401이다.
    ApiKeyQueryAuth:
      type: apiKey
      in: query
      name: key
      description: >
        /care/call-events 전용. 발신 앱(mobserve 등)이 커스텀 헤더를 못 보내는
        경우가 있어 ApiKeyAuth와 같은 BIGWASH_INTERNAL_API_KEY 값을 쿼리
        파라미터로 대신 받는다. 미설정·오키는 기본 401이며 개발 예외 정책은
        ApiKeyAuth와 동일하다.
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: "API 키 미설정·누락·불일치(기본 fail-closed). Cache-Control: no-store"
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string, example: Unauthorized }
  schemas:
    SiteChecklistItemInput:
      type: object
      required: [item_code, result]
      properties:
        item_code:
          type: string
          enum: [WATER_SUPPLY, POWER_WIRING, PUMP_PRESSURE, LEAK, FILTER, CHEMICAL, SAFETY, CLEANLINESS]
        result: { type: string, enum: [OK, ATTENTION, FAIL, NOT_APPLICABLE] }
        note: { type: string, nullable: true }
    SiteChecklistItem:
      allOf:
        - $ref: "#/components/schemas/SiteChecklistItemInput"
        - type: object
          properties:
            id: { type: integer }
            item_label: { type: string, description: "저장 당시 서버 정본 항목명 스냅샷" }
    SiteChecklist:
      type: object
      properties:
        id: { type: integer }
        site_id: { type: integer }
        customer_id: { type: integer }
        site_name: { type: string }
        site_address: { type: string, nullable: true }
        inspected_on: { type: string, format: date }
        inspector: { type: string }
        overall_result: { type: string, enum: [PASS, ATTENTION, FAIL], description: "항목 결과에서 서버 계산" }
        notes: { type: string, nullable: true }
        completed_at: { type: string }
        created_at: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SiteChecklistItem" }
    OkCustomer:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            phone: { type: string }
            email: { type: string }
            memo: { type: string }
            customer_type: { type: string, enum: [LEAD, CUSTOMER, SERVICE, VENDOR] }
            address: { type: string }
            legacy_client_id: { type: integer, nullable: true }
            migration_status: { type: string, enum: [VERIFIED, NEEDS_REVIEW] }
            created_at: { type: string }
            updated_at: { type: string }
    OpsTicketRow:
      type: object
      description: "GET /care/ops-summary의 overdue/unscheduled/visits_today 섹션 items 원소"
      properties:
        id: { type: integer }
        site_id: { type: integer }
        symptom: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        status: { type: string, enum: [RECEIVED, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
        scheduled_at: { type: string, nullable: true }
        site_name: { type: string }
        contact_phone: { type: string }
    OpsEquipmentRow:
      type: object
      description: "GET /care/ops-summary의 warranty_expiring 섹션 items 원소"
      properties:
        id: { type: integer }
        model: { type: string }
        category: { type: string }
        warranty_ends_at: { type: string }
        status: { type: string, enum: [ACTIVE, REPAIR, RETIRED] }
        site_id: { type: integer }
        site_name: { type: string }
        contact_phone: { type: string }
    CarePlanRow:
      type: object
      description: >
        /care/care-plans* 응답 원소. effective_status는 저장되지 않는 파생
        필드 — status가 ACTIVE이고 ends_at이 지났을 때만 EXPIRED로 보여준다
        (CANCELLED/RENEWED는 절대 EXPIRED로 바뀌지 않음). customer_id/
        customer_name/site_name은 목록 전용 optional 필드다 — GET
        /care/care-plans(site_id/customer_id 필터 여부와 무관하게 세 목록
        경로 전부)의 응답에만 sites/customers를 JOIN해 채워지고, POST
        생성·GET/PUT :id 단건 조회·수정·cancel·renew 응답(전부 `get-careplan`
        경유, JOIN 없음)에는 나타나지 않는다.
      properties:
        id: { type: integer }
        site_id: { type: integer }
        customer_id: { type: integer, nullable: true, description: "목록(GET /care/care-plans) 응답에서만 sites 조인으로 채워짐 — 단건/생성/수정/취소/갱신 응답에는 없음" }
        customer_name: { type: string, nullable: true, description: "목록(GET /care/care-plans) 응답에서만 customers 조인으로 채워짐 — 단건/생성/수정/취소/갱신 응답에는 없음" }
        site_name: { type: string, nullable: true, description: "목록(GET /care/care-plans) 응답에서만 sites 조인으로 채워짐 — 단건/생성/수정/취소/갱신 응답에는 없음" }
        plan_code: { type: string, enum: [TRIAL_90, BASIC_360, FIELD_790] }
        status: { type: string, enum: [ACTIVE, CANCELLED, RENEWED], description: "DB에 저장되는 값 — 시간 경과로 자동 전이하지 않음" }
        effective_status: { type: string, enum: [ACTIVE, CANCELLED, RENEWED, EXPIRED], description: "응답 조립 시 파생되는 값(저장 안 됨)" }
        starts_at: { type: string, format: date }
        ends_at: { type: string, format: date, description: "starts_at 포함 계산 (starts_at + 기간일수 - 1)" }
        price_snapshot: { type: integer, minimum: 0 }
        included_visits: { type: integer, minimum: 0 }
        used_visits: { type: integer, minimum: 0, description: "0..included_visits, PUT으로만 절대값 갱신" }
        next_inspection_at: { type: string, format: date, nullable: true }
        renewed_from_id: { type: integer, nullable: true, description: "갱신으로 생성된 행이면 원본 CarePlan id" }
        memo: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ContractItem:
      type: object
      description: "GET /care/contracts/{id} 상세의 items[] 원소. subtotal = quantity*unit_price(서버 계산)"
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: integer, minimum: 0 }
        subtotal: { type: integer, minimum: 0 }
    ContractSummary:
      type: object
      description: "GET /care/contracts 목록 원소 (7주차 2026-07-22). amount는 항목 합계로 서버가 계산·유지한다."
      properties:
        id: { type: integer }
        number: { type: string, example: "CTR-1784652881831-2767" }
        status: { type: string, enum: [DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED] }
        customer_id: { type: integer }
        customer_name: { type: string, description: "customers 조인" }
        site_id: { type: integer, nullable: true }
        site_name: { type: string, nullable: true, description: "sites 조인, site_id 없으면 null" }
        title: { type: string, nullable: true }
        amount: { type: integer, minimum: 0, description: "items 합계, 서버 계산값(요청 amount는 무시됨)" }
        quote_id: { type: integer, nullable: true, description: "견적 전환으로 생성된 계약이면 원본 quote id" }
        contract_date: { type: string, format: date }
        work_starts_at: { type: string, format: date, nullable: true }
        work_ends_at: { type: string, format: date, nullable: true }
        warranty_ends_at: { type: string, format: date, nullable: true }
        signed_at: { type: string, nullable: true, description: "APPROVED 전이 시 자동/수동 기록, 그 전에는 null" }
        work_scope: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ContractDetail:
      type: object
      description: "POST/GET/PUT /care/contracts(/{id}, /{id}/status) 공통 응답 shape"
      properties:
        contract: { $ref: "#/components/schemas/ContractSummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ContractItem" }
        history:
          type: array
          description: "changed_at ASC, id ASC. 생성 시점에는 비어 있고 상태전이마다 1건씩 추가됨"
          items:
            type: object
            properties:
              id: { type: integer }
              contract_id: { type: integer }
              old_status: { type: string, enum: [DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED] }
              new_status: { type: string, enum: [DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED] }
              changed_at: { type: string }
