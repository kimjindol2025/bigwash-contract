openapi: 3.0.3
info:
  title: WashCare Phase 1 API
  description: >
    대한이엔지 장비 안심관리(WashCare) Phase 1 API. 실측 검증일 2026-07-16,
    라우트 동기화 2026-07-21(docs/09 1~5주차, src/washcare-api.fl 라우트 전수 대조 —
    `/care/care-plans*` 포함 시 JSON API 53개, 5주차는 GET /care/care-plans
    무필터 응답 계약만 갱신되고 라우트 수는 변하지 않음).
    상세 설명은 04-washcare-api.md 참조. 정적 Admin UI(`GET /care/admin`)와
    루트 리다이렉트(`GET /`)는 JSON API가 아니므로 이 스펙에서 명시적으로
    제외한다 — Admin UI 설명은 04-washcare-api.md의 "Admin UI (MVP)" 절 참조.
  version: "1.0.0-phase1"
servers:
  - url: http://127.0.0.1:40101
    description: 로컬 개발 (BIGWASH_CARE_PORT로 변경 가능, 기본 40101)
security:
  - ApiKeyAuth: []
  - {}
paths:
  /care/customers:
    post:
      summary: 고객 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                memo: { type: string }
                customer_type: { type: string, enum: [LEAD, CUSTOMER, SERVICE, VENDOR], default: LEAD }
                address: { type: string }
      responses:
        "200":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkCustomer"
        "400": { description: "customer_type이 허용값이 아니면 400" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: "고객 검색 (name/phone/address/memo LIKE 부분일치, 전화번호 하이픈 무관, 최대 50건)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: filter
          in: query
          required: false
          schema: { type: string, enum: [ALL, LEAD, CUSTOMER, SERVICE, VENDOR], default: ALL }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/incoming-call:
    get:
      summary: 전화 수신 자동조회 (안드로이드 Tasker/MacroDroid 연동용, 2026-07-21 추가)
      description: >-
        발신번호로 고객을 정확 일치(하이픈 무관) 조회한다. search-customers와
        달리 부분일치가 아니라 정확 일치만 — 착신 팝업에 엉뚱한 고객이 뜨면
        안 되기 때문. 문서: docs/11-mobile-caller-lookup.md
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: phone
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ok, found, data} — found=false면 data=null(신규 발신자)" }
        "400": { description: "phone 파라미터 누락" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customers/{id}:
    get:
      summary: 고객 상세 조회
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 고객 상세 }
        "404": { description: "Customer not found" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations:
    post:
      summary: 상담 기록 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, consulted_at, content]
              properties:
                customer_id: { type: integer }
                consulted_at: { type: string, format: date-time }
                method: { type: string, enum: [PHONE, SMS, KAKAO, VISIT, OTHER], default: PHONE }
                content: { type: string }
                next_action: { type: string, enum: [NONE, CALLBACK, QUOTE, SERVICE_TICKET, SALE, CONTRACT_REVIEW], default: NONE }
                next_contact_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 method/next_action 등" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 상담 기록 목록 (consulted_at DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/{id}/complete:
    put:
      summary: "상담 완료 처리 (건별 completed_at 기록, 최신 1건만 남기지 않고 개별 완료)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/due-today:
    get:
      summary: "오늘 다시 연락할 상담 목록 (completed_at IS NULL, date(next_contact_at) <= date('now'))"
      security: [{ApiKeyAuth: []}, {}]
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/recent:
    get:
      summary: "최근 상담 목록 (limit 기본 15)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 15 }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/pending:
    get:
      summary: "다음 조치가 남은 상담 목록 (completed_at IS NULL AND next_action <> 'NONE')"
      security: [{ApiKeyAuth: []}, {}]
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/sites:
    post:
      summary: 사업장 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, name]
              properties:
                customer_id: { type: integer }
                name: { type: string }
                address: { type: string }
                contact_phone: { type: string }
      responses:
        "200": { description: 생성됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: 고객별 사업장 목록
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/equipment:
    post:
      summary: 장비 등록
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, category]
              properties:
                site_id: { type: integer }
                contract_id: { type: integer, nullable: true }
                category: { type: string }
                model: { type: string }
                serial_number: { type: string, description: "UNIQUE — 중복 시 400(실측 2026-07-21). error 필드에 내부 정보 노출은 개선 후보" }
                installed_at: { type: string, format: date }
                warranty_ends_at: { type: string, format: date }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "실측 확인됨(2026-07-21) — serial_number 중복 등 도메인 에러는 400. 다만 error 필드가 내부 파일경로·줄번호·콜스택을 그대로 노출함(개선 후보, docs/04 에러 계약 절 참조)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 장비 목록 (site 조인, installed_at DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-contacts:
    post:
      summary: 고객 담당자 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, name]
              properties:
                customer_id: { type: integer }
                name: { type: string }
                position: { type: string }
                department: { type: string }
                phone: { type: string }
                email: { type: string }
                role: { type: string, enum: [OWNER, MANAGER, SITE_MANAGER, ACCOUNTING, PURCHASING, FACILITY, OTHER], default: OTHER }
                is_primary: { type: boolean, default: false }
                status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 role/status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 담당자 목록 (is_primary DESC, 최신순)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-tasks:
    post:
      summary: 고객 할 일 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, title]
              properties:
                customer_id: { type: integer }
                title: { type: string }
                due_at: { type: string, format: date-time, nullable: true }
                priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 priority" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 할 일 목록 (마감일 오름차순, 마감일 없는 건은 뒤로)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-tasks/{id}/complete:
    put:
      summary: "할 일 완료 처리 (status=DONE, completed_at 기록)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-followups:
    post:
      summary: 사후관리 예정 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, scheduled_at]
              properties:
                customer_id: { type: integer }
                followup_type:
                  type: string
                  enum: [CONSULT_RECALL, QUOTE_CHECK, INSTALL_CHECK, SERVICE_CHECK, REPAIR_RECHECK, PAYMENT_NOTICE, CONSUMABLE_NOTICE, WARRANTY_END_NOTICE, CARE_PLAN_RENEWAL, LONG_TERM_INACTIVE]
                  default: CONSULT_RECALL
                scheduled_at: { type: string, format: date-time }
                contact_method: { type: string, enum: [PHONE, SMS, KAKAO, VISIT, OTHER], nullable: true }
                result: { type: string, nullable: true }
                customer_reaction: { type: string, nullable: true }
                next_followup_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 followup_type/contact_method" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 사후관리 목록 (scheduled_at DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-followups/{id}/complete:
    put:
      summary: "사후관리 완료 처리 (completed_at 기록)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes:
    post:
      summary: 고객 견적 생성
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, title, amount]
              properties:
                customer_id: { type: integer }
                title: { type: string }
                amount: { type: number }
                valid_until: { type: string, format: date, nullable: true }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "요청값 오류" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 견적 목록 (created_at DESC, id DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes/{id}/status:
    put:
      summary: "견적 상태 변경 (DRAFT→SENT→REVIEWING→REVISION_REQUESTED→SENT 흐름 + ON_HOLD/REJECTED 분기만 허용)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, SENT, REVIEWING, REVISION_REQUESTED, APPROVED, ON_HOLD, REJECTED, CONVERTED] }
      responses:
        "200": { description: 갱신됨 }
        "400": { description: "Quote not found | Invalid quote status transition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes/{id}/convert:
    post:
      summary: "승인 견적을 계약으로 전환 (APPROVED만 가능)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "CONVERTED 상태의 견적 반환" }
        "400": { description: "Only APPROVED quotes can be converted to a contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/timeline:
    get:
      summary: "고객 통합 타임라인 (상담·판매·견적·계약·출장·사후관리 UNION ALL, event_at DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [ALL, CONSULTATION, SALE, QUOTE, CONTRACT, TICKET, FOLLOWUP], default: ALL }
      responses:
        "200": { description: 목록 }
        "400": { description: "type must be one of ALL, CONSULTATION, SALE, QUOTE, CONTRACT, TICKET, FOLLOWUP" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/contracts:
    get:
      summary: "고객별 계약 목록 (created_at DESC, id DESC)"
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/tickets:
    post:
      summary: A/S 접수 (공개 토큰 발급)
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, symptom]
              properties:
                site_id: { type: integer }
                equipment_id: { type: integer, nullable: true }
                symptom: { type: string }
                priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
                source: { type: string, enum: [PHONE, MESSAGE, WEB, INTERNAL] }
                scheduled_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: "생성됨. public_token은 이 응답에서만 원문으로 내려옴(재조회 불가)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string, example: RECEIVED }
                      public_token: { type: string, description: "64자 hex, 저장 시 SHA-256 해시로만 보관됨" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: 상태별 티켓 목록 (Admin UI용)
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [RECEIVED, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
        - name: today
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: "1이면 오늘 생성된 티켓만"
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/tickets/{id}/status:
    put:
      summary: 티켓 상태 변경
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [RECEIVED, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
      responses:
        "200":
          description: >
            상태 변경됨. COMPLETED는 공개 링크를 즉시 폐기하지 않고 7일간 유지(고객이
            완료 상태를 확인할 수 있도록, 2026-07-16 수정). CANCELLED는 즉시 폐기.
        "400": { description: "실측 확인됨(2026-07-21) — 잘못된 전이/존재하지 않는 티켓 모두 400. 다만 error 필드가 내부 파일경로·줄번호·콜스택을 그대로 노출함(개선 후보, docs/04 에러 계약 절 참조)" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/tickets/{id}/visits:
    post:
      summary: 방문·수리 이력 추가
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                technician: { type: string }
                visited_at: { type: string, format: date-time }
                diagnosis: { type: string }
                action_taken: { type: string }
                parts_used: { type: string }
                labor_cost: { type: number }
                parts_cost: { type: number }
                next_inspection_at: { type: string, format: date, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/tickets/{id}:
    get:
      summary: 티켓 상세 (방문·상태변경 이력 포함)
      security: [{ApiKeyAuth: []}, {}]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200": { description: "{ticket, visits, history}" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "실측 확인됨 — 존재하지 않는 티켓" }

  /care/part-sales:
    post:
      summary: "부품판매 등록 (A/S와 독립적으로도 가능, 매출 30%)"
      security: [{ApiKeyAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, part_name, unit_price]
              properties:
