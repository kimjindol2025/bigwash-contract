openapi: 3.0.3
info:
  title: WashCare Phase 1 API
  description: >
    대한이엔지 장비 안심관리(WashCare) Phase 1 API. 보안 게이트·라우트
    동기화 2026-07-31(src/washcare-api.fl 전수 대조 — 내부 59개 + 공개 2개,
    JSON API 총 61개). 7주차(2026-07-22)에 계약관리 API 4개
    (POST /care/contracts, GET/PUT /care/contracts/{id},
    PUT /care/contracts/{id}/status)가 기존 GET /care/contracts와 함께
    추가됐다 — 상세는 docs/13-contract-management-report.md 참조.
    상세 설명은 04-washcare-api.md 참조. 정적 Admin UI(`GET /care/admin`)와
    루트 리다이렉트(`GET /`)는 JSON API가 아니므로 이 스펙에서 명시적으로
    제외한다 — Admin UI 설명은 04-washcare-api.md의 "Admin UI (MVP)" 절 참조.
  version: "1.0.0-phase1"
servers:
  - url: http://127.0.0.1:40101
    description: 로컬 개발 (BIGWASH_CARE_PORT로 변경 가능, 기본 40101)
security:
  - ApiKeyAuth: []
paths:
  /care/customers:
    post:
      summary: 고객 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                memo: { type: string }
                customer_type: { type: string, enum: [LEAD, CUSTOMER, SERVICE, VENDOR], default: LEAD }
                address: { type: string }
      responses:
        "200":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkCustomer"
        "400": { description: "customer_type이 허용값이 아니면 400" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: "고객 검색 (name/phone/address/memo LIKE 부분일치, 전화번호 하이픈 무관, 최대 50건)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: filter
          in: query
          required: false
          schema: { type: string, enum: [ALL, LEAD, CUSTOMER, SERVICE, VENDOR], default: ALL }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/incoming-call:
    get:
      summary: 전화 수신 자동조회 (안드로이드 Tasker/MacroDroid 연동용, 2026-07-21 추가)
      description: >-
        발신번호로 고객을 정확 일치(하이픈 무관) 조회한다. search-customers와
        달리 부분일치가 아니라 정확 일치만 — 착신 팝업에 엉뚱한 고객이 뜨면
        안 되기 때문. 문서: docs/11-mobile-caller-lookup.md
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: phone
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ok, found, data} — found=false면 data=null(신규 발신자)" }
        "400": { description: "phone 파라미터 누락" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/call-events:
    post:
      summary: 자동 통화·문자 로거 webhook 수신 (mobserve/MacroDroid 등, 2026-07-21 추가)
      description: >-
        안드로이드 자동화 앱(syncloudsoftech/mobserve 또는 MacroDroid — 같은
        JSON 형식으로 맞춰서 호출)이 통화·문자 직후 보내는 webhook을 받아
        call_events에 원본 저장하고, 발신번호가 기존 고객과 일치하면 고객
        타임라인에도 노출한다. 모르는 번호도 버리지 않고 customer_id NULL로
        저장(소급 연결용, 타임라인엔 안 뜸). mobserve는 커스텀 헤더를 못
        보내므로(소스 확인) 이 엔드포인트만 `x-api-key` 헤더 대신 `?key=`
        쿼리파라미터로 인증한다. 문서: docs/11-mobile-caller-lookup.md
      security: [{ApiKeyQueryAuth: []}]
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, direction, participant]
              properties:
                event: { type: string, enum: [call, sms] }
                direction: { type: string, enum: [incoming, outgoing, missed] }
                participant: { type: string, description: "국제(+82...)/국내(010-...) 둘 다 허용" }
                content: { type: string, description: "sms일 때만" }
                duration: { type: integer, description: "call일 때만, 초 단위" }
                date:
                  type: integer
                  description: >-
                    epoch milliseconds. 선택값 — 생략하면 서버 수신 시각을 쓴다
                    (MacroDroid처럼 밀리초 타임스탬프를 만들기 번거로운 앱 대응,
                    2026-07-21 추가)
      responses:
        "200": { description: "{ok, data:{matched, customer_id}}" }
        "400": { description: "participant/direction/date 누락" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customers/{id}:
    get:
      summary: 고객 상세 조회
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 고객 상세 }
        "404": { description: "Customer not found" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations:
    post:
      summary: 상담 기록 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, consulted_at, content]
              properties:
                customer_id: { type: integer }
                consulted_at: { type: string, format: date-time }
                method: { type: string, enum: [PHONE, SMS, KAKAO, VISIT, OTHER], default: PHONE }
                content: { type: string }
                next_action: { type: string, enum: [NONE, CALLBACK, QUOTE, SERVICE_TICKET, SALE, CONTRACT_REVIEW], default: NONE }
                next_contact_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 method/next_action 등" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 상담 기록 목록 (consulted_at DESC)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/{id}/complete:
    put:
      summary: "상담 완료 처리 (건별 completed_at 기록, 최신 1건만 남기지 않고 개별 완료)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/due-today:
    get:
      summary: "오늘 다시 연락할 상담 목록 (completed_at IS NULL, date(next_contact_at) <= date('now'))"
      security: [{ApiKeyAuth: []}]
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/recent:
    get:
      summary: "최근 상담 목록 (limit 기본 15)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 15 }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/consultations/pending:
    get:
      summary: "다음 조치가 남은 상담 목록 (completed_at IS NULL AND next_action <> 'NONE')"
      security: [{ApiKeyAuth: []}]
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/sites:
    post:
      summary: 사업장 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, name]
              properties:
                customer_id: { type: integer }
                name: { type: string }
                address: { type: string }
                contact_phone: { type: string }
                site_stage:
                  type: string
                  enum: [CANDIDATE, OPERATING, REJECTED]
                  default: OPERATING
                  description: "CANDIDATE이면 후보지 추가, 생략하면 기존과 같이 운영 현장"
      responses:
        "200": { description: 생성됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: 고객별 사업장 목록
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/site-checklists:
    post:
      summary: "주소(현장)별 점검 체크리스트 저장 — 정본 8개 항목"
      description: >
        site_id가 주소별 격리 경계다. 같은 고객에게 현장이 여러 개 있어도
        체크리스트는 지정한 현장에만 누적된다. items는 서버 정본 코드 8개를
        정확히 한 번씩 보내야 하며 종합 결과는 FAIL > ATTENTION > PASS
        우선순위로 서버가 계산한다.
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, inspected_on, inspector, items]
              properties:
                site_id: { type: integer, minimum: 1 }
                inspected_on: { type: string, format: date }
                inspector: { type: string, minLength: 1 }
                notes: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 8
                  maxItems: 8
                  items: { $ref: "#/components/schemas/SiteChecklistItemInput" }
      responses:
        "200":
          description: 저장된 주소별 체크리스트
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/SiteChecklist" }
        "400": { description: "잘못된 site_id/날짜/점검자/항목 코드·결과·개수 또는 중복 항목" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "주소(현장)별 점검 체크리스트 이력"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: site_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: "점검일 최신순 목록, 각 기록에 items 포함"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SiteChecklist" }
        "400": { description: "site_id 누락·형식 오류·0 이하" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/equipment:
    post:
      summary: 장비 등록
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, category]
              properties:
                site_id: { type: integer }
                contract_id: { type: integer, nullable: true }
                category: { type: string }
                model: { type: string }
                serial_number: { type: string, description: "UNIQUE — 중복 시 400. 외부 error는 새니타이즈됨" }
                installed_at: { type: string, format: date }
                warranty_ends_at: { type: string, format: date }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "serial_number 중복 등 도메인 에러. 내부 파일경로·스택·DB 엔진 정보는 노출하지 않음" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 장비 목록 (site 조인, installed_at DESC)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-contacts:
    post:
      summary: 고객 담당자 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, name]
              properties:
                customer_id: { type: integer }
                name: { type: string }
                position: { type: string }
                department: { type: string }
                phone: { type: string }
                email: { type: string }
                role: { type: string, enum: [OWNER, MANAGER, SITE_MANAGER, ACCOUNTING, PURCHASING, FACILITY, OTHER], default: OTHER }
                is_primary: { type: boolean, default: false }
                status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 role/status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 담당자 목록 (is_primary DESC, 최신순)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-tasks:
    post:
      summary: 고객 할 일 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, title]
              properties:
                customer_id: { type: integer }
                title: { type: string }
                due_at: { type: string, format: date-time, nullable: true }
                priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 priority" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 할 일 목록 (마감일 오름차순, 마감일 없는 건은 뒤로)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-tasks/{id}/complete:
    put:
      summary: "할 일 완료 처리 (status=DONE, completed_at 기록)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-followups:
    post:
      summary: 사후관리 예정 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, scheduled_at]
              properties:
                customer_id: { type: integer }
                followup_type:
                  type: string
                  enum: [CONSULT_RECALL, QUOTE_CHECK, INSTALL_CHECK, SERVICE_CHECK, REPAIR_RECHECK, PAYMENT_NOTICE, CONSUMABLE_NOTICE, WARRANTY_END_NOTICE, CARE_PLAN_RENEWAL, LONG_TERM_INACTIVE]
                  default: CONSULT_RECALL
                scheduled_at: { type: string, format: date-time }
                contact_method: { type: string, enum: [PHONE, SMS, KAKAO, VISIT, OTHER], nullable: true }
                result: { type: string, nullable: true }
                customer_reaction: { type: string, nullable: true }
                next_followup_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "잘못된 followup_type/contact_method" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 사후관리 목록 (scheduled_at DESC)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/customer-followups/{id}/complete:
    put:
      summary: "사후관리 완료 처리 (completed_at 기록)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 갱신됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes:
    post:
      summary: 고객 견적 생성
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, title, amount]
              properties:
                customer_id: { type: integer }
                title: { type: string }
                amount: { type: number }
                valid_until: { type: string, format: date, nullable: true }
                memo: { type: string }
      responses:
        "200": { description: 생성됨 }
        "400": { description: "요청값 오류" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: "고객별 견적 목록 (created_at DESC, id DESC)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 목록 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes/{id}/status:
    put:
      summary: "견적 상태 변경 (DRAFT→SENT→REVIEWING→REVISION_REQUESTED→SENT 흐름 + ON_HOLD/REJECTED 분기만 허용)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, SENT, REVIEWING, REVISION_REQUESTED, APPROVED, ON_HOLD, REJECTED, CONVERTED] }
      responses:
        "200": { description: 갱신됨 }
        "400": { description: "Quote not found | Invalid quote status transition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/quotes/{id}/convert:
    post:
      summary: "승인 견적을 계약으로 전환 (APPROVED만 가능)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "CONVERTED 상태의 견적 반환" }
        "400": { description: "Only APPROVED quotes can be converted to a contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/timeline:
    get:
      summary: "고객 통합 타임라인 (상담·판매·견적·계약·출장·사후관리 UNION ALL, event_at DESC)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: customer_id
          in: query
          required: true
          schema: { type: integer }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [ALL, CONSULTATION, SALE, QUOTE, CONTRACT, TICKET, FOLLOWUP], default: ALL }
      responses:
        "200": { description: 목록 }
        "400": { description: "type must be one of ALL, CONSULTATION, SALE, QUOTE, CONTRACT, TICKET, FOLLOWUP" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/contracts:
    get:
      summary: "계약 목록 — status/customer_id/site_id/q 전부 선택 필터 (created_at DESC, id DESC, 최대 50건, 7주차 2026-07-22 확장)"
      description: >-
        네 파라미터 전부 생략 가능(무필터 전체 최신 50건). status는 DESIGN
        5값(DRAFT/PENDING/APPROVED/COMPLETED/CANCELLED)만 허용, 그 외 값은
        400. q는 계약번호/제목/고객명/현장명에 대한 LIKE 부분일치이며 SQL
        메타문자가 섞여도 파라미터 바인딩으로 안전하게 처리되어 결과가 0건일
        뿐 목록이 노출되지 않는다.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED] }
        - name: customer_id
          in: query
          required: false
          schema: { type: integer }
        - name: site_id
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "목록(ContractSummary[], 고객명/현장명 join 포함)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractSummary" }
        "400": { description: "status must be one of DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED | customer_id/site_id must be an integer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: "계약 수동 생성 — 서버가 items 합계로 amount 계산 (7주차 2026-07-22 추가)"
      description: >-
        contract_date 생략/빈 문자열이면 Asia/Seoul 기준 오늘 날짜가 기본값이다.
        items는 최소 1개 필수(description/quantity 양의 정수/unit_price 0
        이상 정수), amount는 요청 값과 무관하게 항목 합계(quantity*unit_price
        총합)로 서버가 재계산한다. site_id를 주면 반드시 같은 customer_id
        소속이어야 하며(다른 고객 현장이면 400), work_starts_at/work_ends_at/
        warranty_ends_at은 각각 실재하는 달력일이어야 하고 work_starts_at은
        work_ends_at보다 늦을 수 없으며 warranty_ends_at은 contract_date보다
        빠를 수 없다. 신규 계약은 항상 status=DRAFT로 시작하고 생성 시점에는
        history를 남기지 않는다(이후 상태전이부터 기록).
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, items]
              properties:
                customer_id: { type: integer }
                site_id: { type: integer, nullable: true, description: "지정 시 customer_id 소속 현장이어야 함" }
                title: { type: string, nullable: true }
                contract_date: { type: string, format: date, nullable: true, description: "생략/빈 문자열이면 Asia/Seoul 오늘" }
                work_starts_at: { type: string, format: date, nullable: true }
                work_ends_at: { type: string, format: date, nullable: true }
                warranty_ends_at: { type: string, format: date, nullable: true }
                work_scope: { type: string, nullable: true }
                memo: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, quantity, unit_price]
                    properties:
                      description: { type: string }
                      quantity: { type: integer, minimum: 1 }
                      unit_price: { type: integer, minimum: 0 }
      responses:
        "200":
          description: "생성됨 — status=DRAFT, amount는 items 합계"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/ContractDetail" }
        "400": { description: "customer_id required | Customer not found | Site not found | site_id must belong to the given customer_id | at least one contract item is required | item 검증 실패 | 날짜 검증 실패" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/contracts/{id}:
    get:
      summary: "계약 상세 + items + history (7주차 2026-07-22 추가)"
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "{contract, items, history}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/ContractDetail" }
        "404": { description: "Contract not found" }
        "400": { description: "id must be an integer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: "계약 전체교체 수정 — DRAFT 상태만 허용 (7주차 2026-07-22 추가)"
      description: >-
        customer_id는 불변(기존 계약의 소유 고객을 그대로 씀 — 요청 본문에
        받지 않음). items는 기존 행을 전부 삭제하고 요청 items로 다시 삽입하는
        전체교체이며, amount는 create와 동일하게 새 items 합계로 서버 재계산.
        DRAFT가 아닌 계약을 수정하려 하면 400. 나머지 검증(날짜/site_id 소속/
        items 최소 1개)은 POST /care/contracts와 동일.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                site_id: { type: integer, nullable: true }
                title: { type: string, nullable: true }
                contract_date: { type: string, format: date, nullable: true }
                work_starts_at: { type: string, format: date, nullable: true }
                work_ends_at: { type: string, format: date, nullable: true }
                warranty_ends_at: { type: string, format: date, nullable: true }
                work_scope: { type: string, nullable: true }
                memo: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, quantity, unit_price]
                    properties:
                      description: { type: string }
                      quantity: { type: integer, minimum: 1 }
                      unit_price: { type: integer, minimum: 0 }
      responses:
        "200":
          description: "갱신됨 — amount는 새 items 합계로 재계산"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/ContractDetail" }
        "404": { description: "Contract not found" }
        "400": { description: "Only DRAFT contracts can be updated | 날짜/items 검증 실패" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /care/contracts/{id}/status:
    put:
      summary: "계약 상태 전이 (5종 상태, DELETE 없음 — 취소는 CANCELLED로만, 7주차 2026-07-22 추가)"
      description: >-
        허용 전이만 통과: DRAFT→PENDING|CANCELLED, PENDING→APPROVED|CANCELLED,
        APPROVED→COMPLETED|CANCELLED. COMPLETED/CANCELLED는 terminal(더 이상
        전이 불가). 그 외 조합은 400. APPROVED로 전이 시 signed_at을
        Asia/Seoul 현재시각으로 자동 채우되, 요청에 signed_at이 있으면 그
        값을 그대로 쓴다(백데이트 허용). 모든 성공 전이는 contract_history에
        old_status/new_status를 기록한다. 이 API에 DELETE는 존재하지 않으며
        계약 삭제·결제·PG 연동 필드도 없다.
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, PENDING, APPROVED, COMPLETED, CANCELLED]
                signed_at:
                  type: string
                  nullable: true
                  description: "APPROVED 전이 시에만 의미 있음. 생략 시 서버가 Asia/Seoul 현재시각으로 채움"
      responses:
        "200":
          description: "전이됨 — history에 old/new status 1건 추가"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/ContractDetail" }
        "404": { description: "Contract not found" }
        "400": { description: "Invalid status transition from X to Y | signed_at must not be blank if provided" }
        "401": { $ref: "#/components/responses/Unauthorized" }

