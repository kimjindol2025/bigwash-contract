<!doctype html>
<html lang="ko">
<head>
<link rel="icon" href="/favicon.ico">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B43D6">
<title>세차장 운영 기록실 | 대한이엔지</title>
<style>
  :root {
    --primary:#6548DB;
    --primary-dark:#4F35C4;
    --primary-soft:#F0ECFF;
    --red:#E85454;
    --red-soft:#FFF0F0;
    --amber:#C98312;
    --amber-soft:#FFF6E7;
    --green:#16845B;
    --green-soft:#EAF8F1;
    --ink:#25262E;
    --muted:#777985;
    --line:#E7E5EE;
    --surface:#FFFFFF;
    --canvas:#F4F3F8;
    --shadow:0 10px 28px rgba(43,36,72,.07);
  }
  * { box-sizing:border-box; }
  html { background:var(--canvas); }
  body { margin:0; color:var(--ink); background:var(--canvas); font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea { font:inherit; }
  button { cursor:pointer; }
  svg { display:block; }
  .app { min-height:100vh; display:grid; grid-template-columns:224px minmax(0,1fr); }
  .sidebar { position:sticky; top:0; height:100vh; background:#fff; border-right:1px solid var(--line); padding:24px 16px; z-index:20; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:11px; padding:0 8px 24px; }
  .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(145deg,#765AE7,#5337C7); box-shadow:0 8px 18px rgba(101,72,219,.25); }
  .brand-title { font-size:15px; font-weight:850; letter-spacing:-.03em; }
  .brand-sub { color:#9A98A5; font-size:10.5px; margin-top:2px; font-weight:650; }
  .nav-label { padding:15px 12px 7px; color:#ABA9B4; font-size:10px; font-weight:800; letter-spacing:.1em; }
  .nav { display:flex; flex-direction:column; gap:3px; }
  .nav-btn { width:100%; border:0; background:transparent; color:#70717D; border-radius:10px; padding:11px 12px; display:flex; align-items:center; gap:11px; text-align:left; font-size:13px; font-weight:700; transition:.16s ease; }
  .nav-btn:hover { background:#F7F5FC; color:var(--primary); }
  .nav-btn.active { background:var(--primary-soft); color:var(--primary-dark); font-weight:850; }
  .nav-btn svg { width:18px; height:18px; }
  .nav-btn[disabled] { opacity:.46; cursor:not-allowed; }
  .phase-badge { margin-left:auto; font-size:9px; padding:2px 6px; border-radius:999px; background:#F0EEF3; color:#9996A3; }
  .sidebar-foot { margin-top:auto; border-top:1px solid var(--line); padding:16px 8px 0; }
  .sidebar-foot p { margin:0; color:#9997A3; font-size:10.5px; line-height:1.55; }
  .workspace { min-width:0; }
  .topbar { min-height:70px; padding:13px 30px; background:rgba(255,255,255,.92); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:18px; position:sticky; top:0; z-index:15; backdrop-filter:blur(14px); }
  .location { display:flex; align-items:center; gap:9px; min-width:0; }
  .location-dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 5px var(--green-soft); flex:none; }
  .site-select { border:0; background:transparent; color:var(--ink); padding:7px 27px 7px 7px; font-size:14px; font-weight:850; max-width:260px; }
  .add-site { width:32px; height:32px; border:1px solid var(--line); background:#fff; color:var(--primary); border-radius:9px; display:grid; place-items:center; font-size:19px; line-height:1; }
  .top-actions { display:flex; align-items:center; gap:9px; }
  .date-input,.key-input { height:40px; border:1px solid var(--line); border-radius:10px; background:#FAFAFC; color:#595A65; padding:0 11px; font-size:12px; font-weight:700; }
  .key-input { width:145px; }
  .main { max-width:1440px; margin:0 auto; padding:30px 32px 54px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:22px; }
  .eyebrow { color:var(--primary); font-size:11px; font-weight:850; letter-spacing:.1em; margin-bottom:7px; }
  h1 { margin:0; font-size:27px; letter-spacing:-.045em; line-height:1.25; }
  .page-desc { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.55; }
  .status-pill { display:flex; align-items:center; gap:7px; border-radius:999px; padding:8px 12px; font-size:11px; font-weight:850; white-space:nowrap; }
  .status-NORMAL { color:var(--green); background:var(--green-soft); }
  .status-CAUTION { color:var(--amber); background:var(--amber-soft); }
  .status-PROBLEM { color:var(--red); background:var(--red-soft); }
  .status-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .quick-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
  .quick-btn { min-height:88px; border:1px solid var(--line); border-radius:15px; background:#fff; padding:17px; text-align:left; display:flex; align-items:center; gap:13px; color:var(--ink); box-shadow:0 3px 12px rgba(43,36,72,.025); transition:.18s ease; }
  .quick-btn:hover { transform:translateY(-2px); border-color:#CFC5F5; box-shadow:var(--shadow); }
  .quick-icon { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none; }
  .quick-icon svg { width:21px; height:21px; }
  .q-purple { color:var(--primary); background:var(--primary-soft); }
  .q-red { color:var(--red); background:var(--red-soft); }
  .q-amber { color:var(--amber); background:var(--amber-soft); }
  .q-green { color:var(--green); background:var(--green-soft); }
  .quick-title { font-size:13px; font-weight:850; }
  .quick-sub { color:#9896A1; font-size:10.5px; margin-top:4px; }
  .metric-grid { display:grid; grid-template-columns:repeat(7,minmax(115px,1fr)); gap:10px; margin-bottom:18px; }
  .metric { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 15px; min-height:99px; }
  .metric.alert { border-color:#F2D8D8; background:linear-gradient(180deg,#fff,#FFFBFB); }
  .metric-label { color:#8A8894; font-size:10.5px; font-weight:750; min-height:28px; line-height:1.35; }
  .metric-value { font-size:23px; font-weight:900; letter-spacing:-.04em; margin-top:8px; }
  .metric-unit { font-size:11px; color:#92909B; font-weight:750; margin-left:2px; }
  .metric.alert .metric-value { color:var(--red); }
  .briefing { background:linear-gradient(130deg,#5F43D2 0%,#7355E4 70%,#7C5DE8 100%); border-radius:18px; color:#fff; padding:23px 25px; display:grid; grid-template-columns:auto 1fr auto; gap:17px; align-items:start; margin-bottom:18px; box-shadow:0 14px 28px rgba(80,52,186,.17); }
  .brief-icon { width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,.15); display:grid; place-items:center; }
  .brief-icon svg { width:23px; height:23px; }
  .brief-title { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:850; margin-bottom:8px; }
  .evidence-badge { padding:3px 7px; border-radius:999px; background:rgba(255,255,255,.14); color:rgba(255,255,255,.78); font-size:9px; }
  .brief-text { font-size:14px; line-height:1.7; font-weight:620; max-width:950px; }
  .brief-link { color:#fff; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.09); border-radius:9px; padding:8px 11px; font-size:10.5px; font-weight:800; white-space:nowrap; }
  .content-grid { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr); gap:18px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 18px rgba(43,36,72,.035); overflow:hidden; }
  .panel-head { min-height:59px; padding:17px 19px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid #EFEDF3; }
  .panel-title { margin:0; font-size:14px; font-weight:850; }
  .panel-meta { color:#9997A2; font-size:10.5px; font-weight:700; }
  .text-btn { border:0; background:transparent; color:var(--primary); font-size:11px; font-weight:850; padding:5px; }
  .problem-list,.vehicle-list,.record-list { display:flex; flex-direction:column; }
  .problem-item { display:grid; grid-template-columns:10px 1fr auto; gap:12px; align-items:start; padding:16px 19px; border-bottom:1px solid #F1EFF4; }
  .problem-item:last-child,.vehicle-item:last-child,.record-row:last-child { border-bottom:0; }
  .problem-bar { width:4px; min-height:42px; border-radius:999px; background:var(--red); margin-top:2px; }
  .problem-bar.amber { background:var(--amber); }
  .problem-bar.purple { background:var(--primary); }
  .problem-title { font-size:12.5px; font-weight:820; line-height:1.45; }
  .problem-desc { color:#8E8C97; font-size:10.5px; line-height:1.5; margin-top:3px; }
  .problem-time { color:#AAA8B2; font-size:9.5px; white-space:nowrap; }
  .vehicle-item { display:grid; grid-template-columns:1fr auto; gap:12px; padding:14px 19px; border-bottom:1px solid #F1EFF4; }
  .vehicle-main { display:flex; align-items:center; gap:11px; min-width:0; }
  .car-mark { width:34px; height:34px; border-radius:10px; background:#F2EFFC; color:var(--primary); display:grid; place-items:center; flex:none; }
  .car-mark svg { width:18px; height:18px; }
  .plate { font-size:12.5px; font-weight:850; }
  .vehicle-note { color:#94929D; font-size:10px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vehicle-time { text-align:right; }
  .vehicle-min { font-size:12.5px; font-weight:850; }
  .vehicle-delay { color:var(--red); font-size:9.5px; margin-top:3px; font-weight:750; }
  .empty { padding:40px 20px; color:#96949F; text-align:center; font-size:12px; line-height:1.6; }
  .empty-icon { width:44px; height:44px; border-radius:14px; margin:0 auto 10px; background:#F3F1F7; display:grid; place-items:center; color:#A5A1B1; }
  .view-panel { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .view-toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:17px 19px; border-bottom:1px solid var(--line); }
  .view-toolbar p { margin:0; color:var(--muted); font-size:12px; }
  .vehicle-crm-search { margin-bottom:18px; padding:18px; border:1px solid #DCD6F0; border-radius:16px; background:linear-gradient(135deg,#fff,#F8F5FF); box-shadow:0 7px 22px rgba(64,45,130,.06); }
  .vehicle-crm-search-head { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:12px; }
  .vehicle-crm-search-title { font-size:14px; font-weight:900; }
  .vehicle-crm-search-help { margin-top:4px; color:var(--muted); font-size:10.5px; }
  .vehicle-crm-search-form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; }
  .vehicle-crm-search-input { width:100%; min-height:48px; border:1px solid #D7D1E6; border-radius:12px; background:#fff; padding:0 14px; color:var(--ink); font-size:15px; font-weight:800; outline:none; }
  .vehicle-crm-search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .vehicle-crm-results { display:grid; gap:8px; margin-top:10px; }
  .vehicle-crm-results:empty { display:none; }
  .vehicle-crm-result { width:100%; min-height:62px; border:1px solid #E4DFEC; border-radius:12px; background:#fff; padding:11px 13px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; text-align:left; color:var(--ink); }
  .vehicle-crm-result:hover { border-color:#C4B8EE; background:var(--primary-soft); }
  .vehicle-crm-result-plate { font-size:14px; font-weight:950; letter-spacing:.02em; }
  .vehicle-crm-result-meta { margin-top:4px; color:var(--muted); font-size:10.5px; line-height:1.45; }
  .vehicle-crm-detail { display:grid; grid-template-columns:290px minmax(0,1fr); gap:17px; align-items:start; }
  .vehicle-profile-card { position:sticky; top:88px; padding:21px; border:1px solid var(--line); border-radius:17px; background:#fff; box-shadow:var(--shadow); }
  .vehicle-profile-mark { width:52px; height:52px; border-radius:15px; display:grid; place-items:center; color:var(--primary); background:var(--primary-soft); }
  .vehicle-profile-mark svg { width:27px; height:27px; }
  .vehicle-profile-plate { margin-top:14px; font-size:22px; font-weight:950; letter-spacing:.015em; }
  .vehicle-profile-model { margin-top:4px; color:var(--muted); font-size:12px; }
  .vehicle-profile-list { display:grid; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .vehicle-profile-row { display:flex; justify-content:space-between; gap:12px; font-size:11px; }
  .vehicle-profile-row span:first-child { color:var(--muted); }
  .vehicle-profile-row strong { text-align:right; }
  .vehicle-attention { margin-top:17px; padding:13px; border-radius:12px; background:var(--amber-soft); color:#765016; font-size:11px; line-height:1.55; }
  .vehicle-attention strong { display:block; margin-bottom:4px; color:var(--amber); }
  .vehicle-history { min-width:0; }
  .vehicle-crm-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin-bottom:13px; }
  .vehicle-crm-metric { padding:14px; border:1px solid var(--line); border-radius:13px; background:#fff; }
  .vehicle-crm-metric span { display:block; color:var(--muted); font-size:9.5px; }
  .vehicle-crm-metric strong { display:block; margin-top:6px; font-size:17px; }
  .visit-timeline { display:flex; flex-direction:column; gap:11px; }
  .visit-card { padding:17px; border:1px solid var(--line); border-radius:15px; background:#fff; }
  .visit-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:11px; border-bottom:1px solid #F0EDF4; }
  .visit-date { font-size:14px; font-weight:900; }
  .visit-site { margin-top:3px; color:var(--muted); font-size:10.5px; }
  .visit-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin-top:12px; }
  .visit-fact { padding:9px 10px; border-radius:10px; background:#F8F7FA; }
  .visit-fact span { display:block; color:var(--muted); font-size:9px; }
  .visit-fact strong { display:block; margin-top:4px; font-size:11px; line-height:1.4; }
  .visit-notes { display:grid; gap:7px; margin-top:11px; }
  .visit-note { padding:9px 10px; border-left:3px solid var(--primary); border-radius:0 9px 9px 0; background:#F8F6FD; font-size:10.5px; line-height:1.5; }
  .condition-chip-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .condition-chip { border-radius:999px; padding:5px 8px; background:#F1EFF5; color:#6F6C78; font-size:9px; font-weight:800; }
  .condition-chip.attention { background:var(--red-soft); color:var(--red); }
  .clickable-record { cursor:pointer; }
  .clickable-record:hover { background:#FAF8FF; }
  .primary-btn,.secondary-btn,.danger-btn { border:0; border-radius:10px; min-height:40px; padding:0 15px; font-size:12px; font-weight:850; }
  .primary-btn { color:#fff; background:var(--primary); }
  .primary-btn:hover { background:var(--primary-dark); }
  .secondary-btn { color:#65636E; background:#F1EFF5; }
  .danger-btn { color:var(--red); background:var(--red-soft); }
  .record-row { padding:16px 19px; border-bottom:1px solid #F0EEF3; display:grid; grid-template-columns:minmax(130px,.8fr) minmax(180px,1.4fr) minmax(120px,.7fr) auto; align-items:center; gap:14px; }
  .record-primary { font-size:12.5px; font-weight:850; }
  .record-secondary { color:#918F9A; font-size:10.5px; margin-top:4px; line-height:1.45; }
  .tag { display:inline-flex; align-items:center; width:max-content; border-radius:999px; padding:5px 9px; font-size:9.5px; font-weight:850; background:#F1EFF5; color:#73717B; }
  .tag.red { background:var(--red-soft); color:var(--red); }
  .tag.amber { background:var(--amber-soft); color:var(--amber); }
  .tag.green { background:var(--green-soft); color:var(--green); }
  .tag.purple { background:var(--primary-soft); color:var(--primary); }
  .equipment-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; padding:16px 19px 19px; }
  .equipment-card { min-width:0; padding:15px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .equipment-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .equipment-card-name { font-size:13.5px; font-weight:900; }
  .equipment-card-meta { min-height:32px; margin-top:6px; color:var(--muted); font-size:10.5px; line-height:1.55; }
  .equipment-card-action { width:100%; min-height:40px; margin-top:12px; border:1px solid #D8D1EE; border-radius:10px; background:var(--primary-soft); color:var(--primary); font-size:11px; font-weight:900; }
  .weekly-grid { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:11px; margin-bottom:18px; }
  .cause-list { padding:12px 19px 20px; }
  .cause-row { display:grid; grid-template-columns:155px 1fr 42px; gap:12px; align-items:center; padding:10px 0; }
  .cause-label { font-size:11.5px; font-weight:750; }
  .cause-track { height:8px; border-radius:999px; background:#EEEAF5; overflow:hidden; }
  .cause-fill { height:100%; border-radius:999px; background:var(--primary); min-width:6px; }
  .cause-count { text-align:right; font-size:11px; font-weight:850; }
  .bottom-nav { display:none; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(24,21,34,.48); z-index:100; display:none; place-items:center; padding:18px; backdrop-filter:blur(4px); }
  .modal-backdrop.open { display:grid; }
  .modal { width:min(680px,100%); max-height:min(860px,calc(100vh - 36px)); overflow:auto; border-radius:20px; background:#fff; box-shadow:0 26px 80px rgba(23,17,45,.28); }
  .modal-head { padding:20px 22px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:15px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:2; }
  .modal-title { margin:0; font-size:18px; font-weight:900; letter-spacing:-.035em; }
  .modal-sub { color:#8D8B96; font-size:11px; margin-top:5px; }
  .close-btn { width:34px; height:34px; border:0; border-radius:10px; background:#F2F0F5; color:#6E6C76; font-size:20px; }
  .form { padding:20px 22px 24px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .field.full { grid-column:1/-1; }
  .field label { display:block; margin:0 0 6px; color:#706E79; font-size:11px; font-weight:800; }
  .required::after { content:' *'; color:var(--red); }
  .field input,.field select,.field textarea { width:100%; border:1px solid #DBD8E3; border-radius:10px; background:#fff; color:var(--ink); padding:10px 11px; min-height:42px; font-size:13px; outline:none; }
  .field textarea { min-height:84px; resize:vertical; line-height:1.5; }
  .field input:focus,.field select:focus,.field textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .lookup-field { position:relative; }
  .lookup-list { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:8; display:flex; flex-direction:column; gap:5px; padding:7px; border:1px solid #DCD7E8; border-radius:12px; background:#fff; box-shadow:0 14px 32px rgba(39,31,72,.16); }
  .lookup-list[hidden] { display:none; }
  .lookup-option { width:100%; min-height:52px; border:0; border-radius:9px; background:#FAF9FC; color:var(--ink); padding:9px 11px; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; }
  .lookup-option:hover,.lookup-option:focus { background:var(--primary-soft); outline:none; }
  .lookup-primary { display:block; font-size:12.5px; font-weight:900; }
  .lookup-meta { display:block; margin-top:3px; color:#8F8C98; font-size:10px; }
  .lookup-count { flex:none; border-radius:999px; padding:4px 7px; background:#EEEAF8; color:var(--primary); font-size:9px; font-weight:850; }
  .auto-size-card { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:10px 12px; border:1px solid #DDD8E8; border-radius:12px; background:#fff; }
  .auto-size-card.resolved { border-color:#B7DFC9; background:var(--green-soft); }
  .auto-size-label { color:#8D8A96; font-size:10px; }
  .auto-size-value { margin-top:3px; color:#66636E; font-size:13px; font-weight:900; }
  .auto-size-card.resolved .auto-size-value { color:var(--green); }
  .manual-size-toggle { flex:none; min-height:36px; border:1px solid #D8D3E1; border-radius:9px; background:#fff; color:#706C79; padding:0 10px; font-size:10px; font-weight:850; }
  .manual-size-grid { margin-top:10px; }
  .manual-size-grid[hidden] { display:none; }
  .check-field { display:flex; align-items:center; gap:8px; min-height:42px; }
  .check-field input { width:18px; height:18px; accent-color:var(--primary); }
  .touch-section { grid-column:1/-1; padding:15px; border:1px solid #ECE9F1; border-radius:14px; background:#FCFBFD; }
  .touch-title { margin:0 0 5px; color:#5F5D68; font-size:12px; font-weight:900; }
  .touch-help { margin:0 0 11px; color:#9A98A2; font-size:10.5px; line-height:1.5; }
  .choice-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .choice-chip { min-height:44px; border:1px solid #DDD9E5; border-radius:12px; background:#fff; color:#6C6975; padding:0 14px; font-size:12px; font-weight:850; touch-action:manipulation; }
  .choice-chip.active { border-color:var(--primary); background:var(--primary-soft); color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .choice-chip.warning.active { border-color:var(--amber); background:var(--amber-soft); color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
  .choice-chip.danger.active { border-color:var(--red); background:var(--red-soft); color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .time-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .time-tap { min-height:58px; border:1px solid #DED9E7; border-radius:12px; background:#fff; color:#777480; padding:8px 11px; text-align:left; }
  .time-tap strong { display:block; color:#514E59; font-size:12px; }
  .time-tap span { display:block; margin-top:4px; color:#9B98A4; font-size:10px; }
  .time-tap.recorded { border-color:var(--green); background:var(--green-soft); }
  .time-tap.recorded strong,.time-tap.recorded span { color:var(--green); }
  .stepper { display:grid; grid-template-columns:48px minmax(64px,1fr) 48px; align-items:center; max-width:230px; border:1px solid #DED9E7; border-radius:12px; overflow:hidden; background:#fff; }
  .stepper button { height:48px; border:0; background:#F3F1F6; color:var(--primary); font-size:22px; font-weight:800; }
  .stepper output { text-align:center; font-size:17px; font-weight:900; }
  .touch-toggle { width:100%; min-height:50px; border:1px dashed #CEC8DA; border-radius:12px; background:#fff; color:#6B6874; font-size:12px; font-weight:850; }
  .touch-toggle.active { border-style:solid; border-color:var(--red); background:var(--red-soft); color:var(--red); }
  .touch-details { grid-column:1/-1; padding:14px; border-radius:12px; background:#F7F5F9; }
  .touch-details[hidden] { display:none; }
  .chat-input { min-height:118px!important; border-radius:16px!important; background:#F8F7FA!important; font-size:15px!important; line-height:1.65!important; }
  .condition-tabs { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:12px 0; padding:4px; border-radius:12px; background:#EFEDF3; }
  .condition-tab { min-height:44px; border:0; border-radius:9px; background:transparent; color:#7D7A86; font-size:12px; font-weight:900; }
  .condition-tab.active { background:#fff; color:var(--primary); box-shadow:0 2px 8px rgba(45,37,75,.09); }
  .condition-panel[hidden] { display:none; }
  .condition-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .condition-toolbar span { color:#8F8C98; font-size:10.5px; }
  .condition-all { min-height:38px; border:1px solid var(--green); border-radius:10px; background:var(--green-soft); color:var(--green); padding:0 12px; font-size:10.5px; font-weight:900; }
  .checkpoint-list { display:flex; flex-direction:column; gap:8px; }
  .checkpoint-row { padding:11px; border:1px solid #E6E2EB; border-radius:12px; background:#fff; }
  .checkpoint-name { margin-bottom:8px; color:#56535F; font-size:11.5px; font-weight:900; }
  .checkpoint-options { display:flex; flex-wrap:wrap; gap:6px; }
  .condition-status { min-height:38px; border:1px solid #DFDBE5; border-radius:9px; background:#fff; color:#777480; padding:0 10px; font-size:10px; font-weight:850; }
  .condition-status.active { border-color:var(--primary); background:var(--primary-soft); color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .condition-status[data-condition-value="NORMAL"].active { border-color:var(--green); background:var(--green-soft); color:var(--green); box-shadow:0 0 0 1px var(--green); }
  .condition-status[data-condition-value="DAMAGE"].active,.condition-status[data-condition-value="RECHECK"].active { border-color:var(--red); background:var(--red-soft); color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .vehicle-condition-note { margin-top:4px; color:var(--primary); font-size:9.5px; font-weight:750; }
  .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:22px; padding-top:17px; border-top:1px solid var(--line); }
  .toast { position:fixed; right:24px; bottom:24px; z-index:200; background:#27242F; color:#fff; padding:12px 16px; border-radius:11px; font-size:12px; font-weight:750; box-shadow:0 10px 35px rgba(0,0,0,.2); opacity:0; transform:translateY(12px); pointer-events:none; transition:.22s; }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.error { background:#B83A3A; }
  .loading { min-height:260px; display:grid; place-items:center; color:#8B8994; font-size:12px; }
  .spinner { width:24px; height:24px; border:3px solid #DED9EF; border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 9px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:1100px) {
    .metric-grid { grid-template-columns:repeat(4,1fr); }
    .quick-grid { grid-template-columns:repeat(2,1fr); }
    .weekly-grid { grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width:820px) {
    .app { display:block; }
    .sidebar { display:none; }
    .topbar { min-height:62px; padding:10px 14px; }
    .location-dot { display:none; }
    .site-select { max-width:175px; font-size:13px; }
    .key-input { display:none; }
    .date-input { max-width:132px; padding:0 7px; font-size:11px; }
    .main { padding:20px 14px 92px; }
    .page-head { position:relative; display:block; }
    .page-head > .status-pill { position:absolute; right:0; top:0; }
    h1 { font-size:23px; }
    .page-desc { font-size:12px; }
    .quick-grid { grid-template-columns:repeat(2,1fr); gap:9px; }
    .quick-btn { min-height:94px; display:block; padding:13px; }
    .quick-icon { width:36px; height:36px; margin-bottom:9px; }
    .quick-sub { display:none; }
    .metric-grid { grid-template-columns:repeat(2,1fr); gap:9px; }
    .metric { min-height:91px; }
    .metric:nth-child(7) { grid-column:1/-1; }
    .briefing { grid-template-columns:auto 1fr; padding:19px 17px; gap:12px; }
    .brief-link { display:none; }
    .brief-text { font-size:12.5px; line-height:1.65; }
    .content-grid { grid-template-columns:1fr; }
    .vehicle-crm-detail { grid-template-columns:1fr; }
    .vehicle-profile-card { position:static; }
    .vehicle-crm-metrics { grid-template-columns:repeat(2,1fr); }
    .visit-grid { grid-template-columns:repeat(2,1fr); }
    .record-row { grid-template-columns:1fr auto; }
    .record-row > :nth-child(2) { grid-column:1/-1; grid-row:2; }
    .record-row > :nth-child(3) { grid-column:1; }
    .weekly-grid { grid-template-columns:repeat(2,1fr); }
    .equipment-grid { grid-template-columns:1fr; padding:12px; }
    .bottom-nav { position:fixed; z-index:50; bottom:0; left:0; right:0; height:72px; padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); display:grid; grid-template-columns:repeat(5,1fr); background:rgba(255,255,255,.96); border-top:1px solid var(--line); backdrop-filter:blur(15px); }
    .bottom-btn { border:0; background:transparent; color:#96939E; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:9px; font-weight:750; }
    .bottom-btn.active { color:var(--primary); }
    .bottom-btn svg { width:19px; height:19px; }
    .form-grid { grid-template-columns:1fr; }
    .field.full { grid-column:auto; }
    .modal-backdrop { padding:0; align-items:end; }
    .modal { width:100%; max-height:92vh; border-radius:20px 20px 0 0; padding-bottom:env(safe-area-inset-bottom); }
    .toast { right:14px; left:14px; bottom:86px; text-align:center; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" data-icon="drop"></div>
      <div><div class="brand-title">운영 기록실</div><div class="brand-sub">DAEHAN ENGINEERING</div></div>
    </div>
    <div class="nav-label">오늘</div>
    <nav class="nav">
      <button class="nav-btn active" data-view="dashboard"><span data-icon="dashboard"></span>운영 대시보드</button>
      <button class="nav-btn" data-view="vehicles"><span data-icon="car"></span>차량 CRM</button>
      <button class="nav-btn" data-view="reworks"><span data-icon="refresh"></span>재작업</button>
      <button class="nav-btn" data-view="equipment"><span data-icon="tool"></span>장비 이상</button>
      <button class="nav-btn" data-view="notes"><span data-icon="note"></span>운영 메모</button>
    </nav>
    <div class="nav-label">분석</div>
    <nav class="nav">
      <button class="nav-btn" data-view="weekly"><span data-icon="report"></span>주간 리포트</button>
      <button class="nav-btn" disabled><span data-icon="users"></span>직원·역할 <span class="phase-badge">2차</span></button>
      <button class="nav-btn" disabled><span data-icon="owner"></span>오너 리포트 <span class="phase-badge">2차</span></button>
    </nav>
    <div class="sidebar-foot"><p>기록은 차량 수보다<br>흔들린 이유를 먼저 남깁니다.</p></div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <div class="location">
        <span class="location-dot"></span>
        <select id="siteSelect" class="site-select" aria-label="사업장 선택"></select>
        <button id="addSiteBtn" class="add-site" aria-label="사업장 추가">+</button>
      </div>
      <div class="top-actions">
        <input id="dateInput" class="date-input" type="date" aria-label="조회 날짜">
      </div>
    </header>
    <main id="main" class="main"><div class="loading"><div><div class="spinner"></div>운영 기록을 불러오는 중입니다</div></div></main>
  </section>
</div>

<nav class="bottom-nav" aria-label="모바일 메뉴">
  <button class="bottom-btn active" data-view="dashboard"><span data-icon="dashboard"></span>오늘</button>
  <button class="bottom-btn" data-view="vehicles"><span data-icon="car"></span>차량</button>
  <button class="bottom-btn" data-view="reworks"><span data-icon="refresh"></span>재작업</button>
  <button class="bottom-btn" data-view="equipment"><span data-icon="tool"></span>장비</button>
  <button class="bottom-btn" data-view="weekly"><span data-icon="report"></span>주간</button>
</nav>

<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="modalTitle" class="modal-title"></h2><div id="modalSub" class="modal-sub"></div></div>
      <button id="closeModal" class="close-btn" aria-label="닫기">×</button>
    </div>
    <form id="modalForm" class="form"></form>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const icons = {
  drop:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.2S6.7 9.5 6.7 14.1a5.3 5.3 0 0 0 10.6 0C17.3 9.5 12 3.2 12 3.2Z" stroke="currentColor" stroke-width="1.9"/><path d="M9.4 15.1c.4 1.2 1.3 1.8 2.5 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  dashboard:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none"><path d="m5 15 1.7-5.3A2.5 2.5 0 0 1 9.1 8h5.8a2.5 2.5 0 0 1 2.4 1.7L19 15M4 15h16v4H4v-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 19v1m10-1v1M7.5 15h.01m8.99 0h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none"><path d="M19 8.5A7.5 7.5 0 0 0 6.5 6L4 8.5m1 7A7.5 7.5 0 0 0 17.5 18l2.5-2.5M4 4v4.5h4.5M20 20v-4.5h-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  tool:'<svg viewBox="0 0 24 24" fill="none"><path d="M14.8 6.2a4 4 0 0 0-5 5L4 17v3h3l5.8-5.8a4 4 0 0 0 5-5l-2.5 2.5-3-3 2.5-2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h9l3 3V20H6V3.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 10h6m-6 3h6m-6 3h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 20V10m5 10V5m5 15v-7m5 7V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0m1-9a3 3 0 0 1 0 5.8M17 14a5.5 5.5 0 0 1 3.5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  owner:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.7"/><path d="m17.5 4 .7 1.4 1.5.2-1.1 1 .3 1.5-1.4-.7-1.3.7.2-1.5-1-1 1.5-.2.6-1.4Z" fill="currentColor"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none"><path d="m12 3 1.3 4.4L18 9l-4.7 1.6L12 15l-1.3-4.4L6 9l4.7-1.6L12 3Zm6 11 .8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14Z" fill="currentColor"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
};
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icons[el.dataset.icon] || ''; });

const initialSiteId=new URLSearchParams(location.search).get('site_id');
const state = { sites:[], siteId:null, date:'', data:null, equipment:[], view:'dashboard', weekly:null, vehicleDetail:null, vehicleSearchTimer:null };
const el = {
  main:document.querySelector('#main'), site:document.querySelector('#siteSelect'), date:document.querySelector('#dateInput'),
  modal:document.querySelector('#modalBackdrop'), form:document.querySelector('#modalForm'),
  modalTitle:document.querySelector('#modalTitle'), modalSub:document.querySelector('#modalSub'), toast:document.querySelector('#toast')
};
function localDate(d=new Date()){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
state.date=localDate(); el.date.value=state.date;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0;}
function fmtMinutes(v){const m=n(v);if(m>=60)return `${Math.floor(m/60)}시간 ${m%60?m%60+'분':''}`.trim();return `${m}분`;}
function fmtMoney(v){return `${Math.round(n(v)).toLocaleString('ko-KR')}원`;}
function timeOnly(v){if(!v)return '-';return String(v).slice(11,16)||String(v).slice(0,5);}
function causeLabel(v){return ({REQUEST_MISSED:'고객 요청 전달 누락',WORK_STEP_MISSED:'작업 순서 누락',INSPECTION_MISSED:'검수 누락',TIME_SHORTAGE:'시간 부족',EXTRA_CONTAMINATION:'추가 오염 미확인',EQUIPMENT:'장비 문제',EXPLANATION_MISMATCH:'설명 기준 불일치',OTHER:'기타'})[v]||v||'-';}
function categoryLabel(v){return ({UNSORTED:'미분류',STAFF:'직원',EQUIPMENT:'장비',FLOW:'동선',CUSTOMER:'고객',PRICE:'가격',BOOKING:'예약',REWORK:'재작업',IDEA:'개선 아이디어'})[v]||v||'-';}
function stateLabel(v){return ({OBSERVE:'관찰 필요',STOPPED:'사용 중지',REPAIR_REQUESTED:'수리 요청',RESOLVED:'해결'})[v]||v||'-';}
function equipmentLabel(v,prefix=''){if(!v)return '장비 미지정';const category=v.category||v.equipment_category||'장비',number=v.category_number||v.equipment_category_number;return `${prefix}${category}${number?' '+number:''}`;}
function statusLabel(v){return ({NORMAL:'정상',CAUTION:'주의',PROBLEM:'문제 발생'})[v]||'기록 전';}
function conditionStatusLabel(v){return ({NORMAL:'정상',CONTAMINATED:'오염',WET_ODOR:'냄새·습기',DAMAGE:'손상',RECHECK:'재확인',NOT_APPLICABLE:'해당 없음'})[v]||v||'-';}
function tagClass(v){if(['PROBLEM','STOPPED','REPAIR_REQUESTED'].includes(v))return 'red';if(['CAUTION','OBSERVE'].includes(v))return 'amber';if(['NORMAL','RESOLVED'].includes(v))return 'green';return 'purple';}

async function api(method,path,body){
  const opts={method,credentials:'same-origin',headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(path,opts);let data={};try{data=await res.json();}catch(_e){}
  if(!res.ok)throw new Error(data.error||`요청 실패 (${res.status})`);return data.data;
}
function showToast(message,error=false){el.toast.textContent=message;el.toast.className=`toast show${error?' error':''}`;clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.toast.className='toast',2600);}
function loading(){el.main.innerHTML='<div class="loading"><div><div class="spinner"></div>기록을 정리하는 중입니다</div></div>';}

async function loadSites(selectFirst=true){
  state.sites=await api('GET','/care/operations/sites');
  el.site.innerHTML=state.sites.length?state.sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''):'<option value="">사업장 없음</option>';
  if(selectFirst&&state.sites.length){const saved=initialSiteId||localStorage.getItem('wash_ops_site_id');state.siteId=state.sites.some(s=>String(s.id)===saved)?saved:String(state.sites[0].id);el.site.value=state.siteId;}
  if(!state.sites.length){state.siteId=null;renderNoSite();return;}
  await loadAll();
}
async function loadAll(){
  if(!state.siteId)return renderNoSite();loading();
  try{
    const q=`site_id=${encodeURIComponent(state.siteId)}&date=${encodeURIComponent(state.date)}`;
    [state.data,state.equipment]=await Promise.all([api('GET',`/care/operations/dashboard?${q}`),api('GET',`/care/operations/equipment?site_id=${encodeURIComponent(state.siteId)}`)]);
    if(state.view==='weekly')await loadWeekly(false);else render();
  }catch(e){renderError(e);}
}
async function loadWeekly(withLoading=true){
  if(withLoading)loading();
  try{state.weekly=await api('GET',`/care/operations/weekly?site_id=${encodeURIComponent(state.siteId)}&end_date=${encodeURIComponent(state.date)}`);renderWeekly();}
  catch(e){renderError(e);}
}
function renderError(e){el.main.innerHTML=`<div class="panel"><div class="empty"><div class="empty-icon">!</div>${esc(e.message)}<br><button class="primary-btn" style="margin-top:14px" data-action="reload">다시 불러오기</button></div></div>`;}
function renderNoSite(){el.main.innerHTML=`<div class="page-head"><div><div class="eyebrow">OPERATIONS ROOM</div><h1>첫 운영 사업장을 등록하세요</h1><p class="page-desc">사업장별 기록은 서로 섞이지 않고 날짜별로 계속 누적됩니다.</p></div></div><div class="panel"><div class="empty" style="padding:70px 20px"><div class="empty-icon">${icons.drop}</div>아직 운영 사업장이 없습니다.<br><button class="primary-btn" style="margin-top:16px" data-action="open-form" data-form="site">사업장 등록</button></div></div>`;}
function pageHead(title,desc,action=''){
  const day=state.data?.day;const status=day?.status||'NORMAL';
  return `<div class="page-head"><div><div class="eyebrow">${esc(state.data?.site?.name||'OPERATIONS ROOM')} · ${esc(state.date)}</div><h1>${title}</h1><p class="page-desc">${desc}</p></div>${action||`<div class="status-pill status-${status}"><span class="status-dot"></span>${statusLabel(day?.status)}</div>`}</div>`;
}
function metric(label,value,unit='',alert=false){return `<div class="metric${alert?' alert':''}"><div class="metric-label">${label}</div><div class="metric-value">${esc(value)}<span class="metric-unit">${unit}</span></div></div>`;}

function switchView(view){state.view=view;if(view!=='vehicle-detail')state.vehicleDetail=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='weekly')loadWeekly();else render();window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('[data-view]').forEach(b=>{if(!b.disabled)b.addEventListener('click',()=>switchView(b.dataset.view));});
document.addEventListener('click',e=>{
  const conditionTab=e.target.closest('[data-condition-tab]');if(conditionTab){e.preventDefault();switchConditionTab(conditionTab.dataset.conditionTab);return;}
  const conditionAll=e.target.closest('[data-condition-all]');if(conditionAll){e.preventDefault();markConditionAreaNormal(conditionAll.dataset.conditionAll);return;}
  const conditionStatus=e.target.closest('[data-condition-status]');if(conditionStatus){e.preventDefault();selectConditionStatus(conditionStatus);return;}
  const choice=e.target.closest('[data-choice-target]');if(choice){e.preventDefault();selectTouchChoice(choice);return;}
  const multi=e.target.closest('[data-multi-target]');if(multi){e.preventDefault();selectTouchMulti(multi);return;}
  const now=e.target.closest('[data-now-target]');if(now){e.preventDefault();recordNow(now);return;}
  const step=e.target.closest('[data-step-target]');if(step){e.preventDefault();stepTouchValue(step);return;}
  const target=e.target.closest('[data-action]');if(!target)return;e.preventDefault();
  const action=target.dataset.action;
  if(action==='reload')loadAll();
  if(action==='open-form'){
    openForm(target.dataset.form);
    if(target.dataset.form==='vehicle'&&target.dataset.prefillPlate){const plate=el.form.elements.plate_number,model=el.form.elements.vehicle_model;if(plate)plate.value=target.dataset.prefillPlate;if(model)model.value=target.dataset.prefillModel||'';updateVehicleSizeDisplay(target.dataset.prefillSize||'',target.dataset.prefillSize?'차량 CRM':'');}
  }
  if(action==='switch-view')switchView(target.dataset.viewTarget);
  if(action==='open-equipment-issue')openEquipmentIssue(Number(target.dataset.id));
  if(action==='resolve-issue')resolveIssue(Number(target.dataset.id));
  if(action==='open-vehicle-detail')openVehicleDetail(Number(target.dataset.id));
  if(action==='close-modal')closeModal();
  if(action==='toggle-details')toggleTouchDetails(target);
  if(action==='select-vehicle-suggestion')applyVehicleSuggestion(target);
  if(action==='select-model-suggestion')applyVehicleModelSuggestion(target);
  if(action==='toggle-size-manual'){
    const grid=el.form.querySelector('.manual-size-grid');if(grid){grid.hidden=!grid.hidden;target.textContent=grid.hidden?'직접 수정':'선택 닫기';}
  }
});

function vehicleConditionHtml(){return `<section class="touch-section" id="vehicleConditionSection"><div class="touch-title">차량 상태 체크포인트</div><div class="touch-help">확인한 항목만 선택하세요. 한 번에 처리하려면 전체 정상을 누릅니다.</div><input type="hidden" name="condition_stage" value="ARRIVAL"><div class="choice-grid" data-choice-group="condition_stage"><button type="button" class="choice-chip active" data-choice-target="condition_stage" data-choice-value="ARRIVAL">입고 상태</button><button type="button" class="choice-chip" data-choice-target="condition_stage" data-choice-value="FINAL">출차 검수</button></div><div class="condition-tabs"><button type="button" class="condition-tab active" data-condition-tab="EXTERIOR">외부 10항목</button><button type="button" class="condition-tab" data-condition-tab="INTERIOR">내부 10항목</button></div><div id="vehicleConditionHost"></div></section>`;}
function renderVehicleConditionChecks(){
  const host=el.form.querySelector('#vehicleConditionHost');if(!host)return;
  host.innerHTML=Object.entries(VEHICLE_CONDITION_CATALOG).map(([area,items])=>`<div class="condition-panel" data-condition-panel="${area}" ${area==='INTERIOR'?'hidden':''}><div class="condition-toolbar"><span>${area==='EXTERIOR'?'외부 상태':'내부 상태'} · 확인한 항목만 저장</span><button type="button" class="condition-all" data-condition-all="${area}">${area==='EXTERIOR'?'외부':'내부'} 전체 정상</button></div><div class="checkpoint-list">${items.map(([code,label])=>`<div class="checkpoint-row" data-condition-row data-area="${area}" data-code="${code}" data-label="${label}"><div class="checkpoint-name">${label}</div><div class="checkpoint-options">${CONDITION_OPTIONS[area].map(([value,text])=>`<button type="button" class="condition-status" data-condition-status data-condition-value="${value}">${text}</button>`).join('')}</div></div>`).join('')}</div></div>`).join('');
}
function switchConditionTab(area){el.form.querySelectorAll('[data-condition-tab]').forEach(x=>x.classList.toggle('active',x.dataset.conditionTab===area));el.form.querySelectorAll('[data-condition-panel]').forEach(x=>x.hidden=x.dataset.conditionPanel!==area);}
function selectConditionStatus(button){const row=button.closest('[data-condition-row]');row.querySelectorAll('[data-condition-status]').forEach(x=>x.classList.toggle('active',x===button));}
function markConditionAreaNormal(area){el.form.querySelectorAll(`[data-condition-row][data-area="${area}"]`).forEach(row=>{const normal=row.querySelector('[data-condition-value="NORMAL"]');if(normal)selectConditionStatus(normal);});}
function collectVehicleConditions(){const stage=el.form.elements.condition_stage?.value||'ARRIVAL';return [...el.form.querySelectorAll('[data-condition-row]')].map(row=>{const selected=row.querySelector('[data-condition-status].active');return selected?{inspection_stage:stage,area_group:row.dataset.area,checkpoint_code:row.dataset.code,checkpoint_label:row.dataset.label,condition_status:selected.dataset.conditionValue,note:null}:null;}).filter(Boolean);}

const vehicleLookupState={plateSeq:0,modelSeq:0};
function vehicleLookupKey(value){return String(value||'').replace(/[\s-]/g,'').toLowerCase();}
function updateVehicleSizeDisplay(size,source=''){
  const input=el.form.elements.vehicle_size,card=el.form.querySelector('#vehicleSizeAuto'),value=el.form.querySelector('#vehicleSizeValue');if(!input)return;
  input.value=size||'';input.dataset.source=source||'';
  el.form.querySelectorAll('[data-choice-target="vehicle_size"]').forEach(x=>x.classList.toggle('active',x.dataset.choiceValue===input.value));
  if(card)card.classList.toggle('resolved',!!size);
  if(value)value.textContent=size?`${size} · ${source||'DB 자동 판정'}`:'차량명을 입력하면 자동으로 정해집니다';
}
function hideVehicleLookups(){el.form.querySelectorAll('.lookup-list').forEach(x=>x.hidden=true);}
function applyVehicleSuggestion(button){
  const plate=el.form.elements.plate_number,model=el.form.elements.vehicle_model;if(!plate||!model)return;
  plate.value=button.dataset.plate||'';plate.dataset.selectedKey=vehicleLookupKey(plate.value);
  model.value=button.dataset.vehicleModel||'';model.dataset.autofilled='plate';
  updateVehicleSizeDisplay(button.dataset.vehicleSize||'',button.dataset.vehicleSize?'최근 작업 이력':'');hideVehicleLookups();
}
function applyVehicleModelSuggestion(button){
  const model=el.form.elements.vehicle_model;if(!model)return;
  model.value=button.dataset.modelName||'';model.dataset.autofilled='model';
  updateVehicleSizeDisplay(button.dataset.vehicleSize||'',button.dataset.vehicleSize?'차량 기준 DB':'');hideVehicleLookups();
}
async function fetchVehicleNumberSuggestions(input){
  const seq=++vehicleLookupState.plateSeq,q=input.value.trim(),box=el.form.querySelector('#vehicleNumberSuggestions');if(!box||!state.siteId)return;
  try{
    const rows=await api('GET',`/care/operations/vehicle-suggestions?site_id=${encodeURIComponent(state.siteId)}&q=${encodeURIComponent(q)}`);if(seq!==vehicleLookupState.plateSeq||!el.form.contains(input))return;
    box.innerHTML=rows.map(x=>`<button type="button" class="lookup-option" role="option" data-action="select-vehicle-suggestion" data-plate="${esc(x.plate_number)}" data-vehicle-model="${esc(x.vehicle_model||'')}" data-vehicle-size="${esc(x.vehicle_size||'')}"><span><span class="lookup-primary">${esc(x.plate_number)}</span><span class="lookup-meta">${esc([x.vehicle_model,x.vehicle_size,x.last_job_date].filter(Boolean).join(' · ')||'차량 정보 없음')}</span></span><span class="lookup-count">${n(x.visit_count)}회</span></button>`).join('');
    box.hidden=!rows.length;
    if(rows.length&&vehicleLookupKey(rows[0].plate_number)===vehicleLookupKey(q))applyVehicleSuggestion(box.firstElementChild);
  }catch(_e){box.hidden=true;}
}
async function fetchVehicleModelSuggestions(input){
  const seq=++vehicleLookupState.modelSeq,q=input.value.trim(),box=el.form.querySelector('#vehicleModelSuggestions');if(!box)return;
  if(!q){box.hidden=true;updateVehicleSizeDisplay('','');return;}
  try{
    const rows=await api('GET',`/care/operations/vehicle-models?q=${encodeURIComponent(q)}`);if(seq!==vehicleLookupState.modelSeq||!el.form.contains(input))return;
    box.innerHTML=rows.map(x=>`<button type="button" class="lookup-option" role="option" data-action="select-model-suggestion" data-model-name="${esc(x.model_name)}" data-vehicle-size="${esc(x.vehicle_size)}"><span><span class="lookup-primary">${esc(x.model_name)}</span><span class="lookup-meta">차량 크기 자동 판정</span></span><span class="lookup-count">${esc(x.vehicle_size)}</span></button>`).join('');box.hidden=!rows.length;
    const typed=vehicleLookupKey(q),matched=rows.find(x=>{const key=vehicleLookupKey(x.model_key);return typed===key||typed.includes(key);});
    if(matched)updateVehicleSizeDisplay(matched.vehicle_size,'차량 기준 DB');else if(el.form.elements.vehicle_size?.dataset.source!=='수동 선택')updateVehicleSizeDisplay('','');
  }catch(_e){box.hidden=true;if(el.form.elements.vehicle_size?.dataset.source!=='수동 선택')updateVehicleSizeDisplay('','');}
}
function setupVehicleLookup(){
  const plate=el.form.elements.plate_number,model=el.form.elements.vehicle_model,size=el.form.elements.vehicle_size;if(!plate||!model||!size)return;
  plate.autocomplete='off';model.autocomplete='off';
  const plateField=plate.closest('.field'),modelField=model.closest('.field');plateField?.classList.add('lookup-field');modelField?.classList.add('lookup-field');
  const plateLabel=plateField?.querySelector('label'),modelLabel=modelField?.querySelector('label');if(plateLabel)plateLabel.textContent='차량번호 · 최근 이력 3개';if(modelLabel)modelLabel.textContent='차량명 · 크기 자동';
  plate.insertAdjacentHTML('afterend','<div id="vehicleNumberSuggestions" class="lookup-list" role="listbox" hidden></div>');
  model.insertAdjacentHTML('afterend','<div id="vehicleModelSuggestions" class="lookup-list" role="listbox" hidden></div>');
  const sizeGrid=el.form.querySelector('[data-choice-group="vehicle_size"]'),sizeSection=sizeGrid?.closest('.touch-section');size.value='';size.dataset.source='';
  sizeGrid?.classList.add('manual-size-grid');if(sizeGrid)sizeGrid.hidden=true;
  const sizeTitle=sizeSection?.querySelector('.touch-title'),sizeHelp=sizeSection?.querySelector('.touch-help');if(sizeTitle)sizeTitle.textContent='차량 크기 · 자동';if(sizeHelp)sizeHelp.textContent='차량명 기준 DB가 정하고, 맞지 않을 때만 직접 바꿉니다.';
  sizeGrid?.insertAdjacentHTML('beforebegin','<div id="vehicleSizeAuto" class="auto-size-card"><div><div class="auto-size-label">적용될 차량 크기</div><div id="vehicleSizeValue" class="auto-size-value">차량명을 입력하면 자동으로 정해집니다</div></div><button type="button" class="manual-size-toggle" data-action="toggle-size-manual">직접 수정</button></div>');
  plate.addEventListener('focus',()=>fetchVehicleNumberSuggestions(plate));plate.addEventListener('input',()=>{if(plate.dataset.selectedKey&&plate.dataset.selectedKey!==vehicleLookupKey(plate.value)){plate.dataset.selectedKey='';if(model.dataset.autofilled==='plate'){model.value='';model.dataset.autofilled='';updateVehicleSizeDisplay('','');}}fetchVehicleNumberSuggestions(plate);});
  model.addEventListener('input',()=>{model.dataset.autofilled='';updateVehicleSizeDisplay('','');fetchVehicleModelSuggestions(model);});
}

    const box=el.form.querySelector('#equipmentChoices'),first=state.equipment[0];
    el.form.elements.equipment_id.value=first?String(first.id):'';
    box.innerHTML=first?state.equipment.map((x,index)=>`<button type="button" class="choice-chip${index===0?' active':''}" data-choice-target="equipment_id" data-choice-value="${x.id}">${esc(equipmentLabel(x))}${x.model?' · '+esc(x.model):''}</button>`).join(''):`<div><div class="touch-help" style="margin-bottom:9px">등록된 장비가 없습니다. 고장 원인과 상태는 지금 확인할 수 있고, 저장하려면 장비를 먼저 등록해 주세요.</div><button type="button" class="secondary-btn" data-action="open-form" data-form="equipment">+ 장비 등록</button></div>`;
  }
  if(type==='rework'){
    const box=el.form.querySelector('#reworkVehicleChoices'),vehicles=state.data?.vehicles||[];
    box.innerHTML=vehicles.length?vehicles.map(x=>`<button type="button" class="choice-chip" data-choice-target="vehicle_job_id" data-choice-value="${x.id}" data-plate="${esc(x.plate_number)}">${esc(x.plate_number)}${x.vehicle_model?' · '+esc(x.vehicle_model):''}</button>`).join(''):'<span class="touch-help">오늘 차량 기록이 없습니다. 아래에 차량번호만 입력하세요.</span>';
    const manual=el.form.elements.manual_plate_number;
    manual.addEventListener('input',()=>{if(!manual.value.trim())return;el.form.elements.vehicle_job_id.value='';el.form.elements.plate_number.value='';box.querySelectorAll('.choice-chip').forEach(x=>x.classList.remove('active'));});
  }
  if(type==='vehicle'){
    const ownerSection=el.form.querySelector('[data-choice-group="owner_involved"]')?.closest('.touch-section');
    ownerSection?.insertAdjacentHTML('beforebegin',vehicleConditionHtml());renderVehicleConditionChecks();setupVehicleLookup();
  }
  if(type==='day'&&state.data?.day){Object.entries(state.data.day).forEach(([k,v])=>{const input=el.form.elements[k];if(input&&v!=null)input.value=String(v).slice(0,input.type==='time'?5:999);});}
  syncTouchForm();
  el.modal.classList.add('open');setTimeout(()=>el.form.querySelector('[autofocus]')?.focus(),80);
}
function openEquipmentIssue(id){openForm('issue');if(el.form.dataset.type!=='issue')return;const input=el.form.elements.equipment_id;input.value=String(id);el.form.querySelectorAll('[data-choice-target="equipment_id"]').forEach(x=>x.classList.toggle('active',String(x.dataset.choiceValue)===String(id)));}
function closeModal(){el.modal.classList.remove('open');}
document.querySelector('#closeModal').addEventListener('click',closeModal);el.modal.addEventListener('click',e=>{if(e.target===el.modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function selectTouchChoice(button){
  const name=button.dataset.choiceTarget,input=el.form.elements[name];if(!input)return;
  input.value=button.dataset.choiceValue??'';
  const group=button.closest('[data-choice-group]')||el.form;
  group.querySelectorAll('[data-choice-target]').forEach(x=>x.classList.toggle('active',x===button));
  if(name==='vehicle_job_id'){const plate=el.form.elements.plate_number;if(plate)plate.value=button.dataset.plate||'';const manual=el.form.elements.manual_plate_number;if(manual)manual.value='';}
  if(name==='vehicle_size')updateVehicleSizeDisplay(input.value,'수동 선택');
  if(name==='status'){const details=el.form.querySelector('[data-status-details]');if(details)details.hidden=input.value==='NORMAL';}
}
function selectTouchMulti(button){
  const name=button.dataset.multiTarget,input=el.form.elements[name],group=button.closest('[data-multi-group]');if(!input||!group)return;
  const value=button.dataset.multiValue,none=group.querySelector('[data-multi-value="NONE"]');
  if(value==='NONE'){group.querySelectorAll('[data-multi-target]').forEach(x=>x.classList.remove('active'));button.classList.add('active');input.value='';return;}
  none?.classList.remove('active');button.classList.toggle('active');
  const values=[...group.querySelectorAll('[data-multi-target].active')].map(x=>x.dataset.multiValue).filter(x=>x!=='NONE');
  input.value=values.join(', ');if(!values.length)none?.classList.add('active');
}
function recordNow(button){
  const name=button.dataset.nowTarget,input=el.form.elements[name];if(!input)return;
  const now=new Date(),value=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  input.value=value;button.classList.add('recorded');const label=button.querySelector(`[data-time-label="${name}"]`);if(label)label.textContent=value+' 기록됨';
}
function stepTouchValue(button){
  const name=button.dataset.stepTarget,input=el.form.elements[name];if(!input)return;
  input.value=String(Math.max(0,n(input.value)+n(button.dataset.step)));const output=el.form.querySelector(`[data-step-output="${name}"]`);if(output)output.textContent=input.value;
}
function toggleTouchDetails(button){
  const panel=el.form.querySelector(`#${button.dataset.panel}`);if(!panel)return;panel.hidden=!panel.hidden;button.classList.toggle('active',!panel.hidden);button.setAttribute('aria-expanded',String(!panel.hidden));
}
function syncTouchForm(){
  el.form.querySelectorAll('[data-choice-target]').forEach(button=>{const input=el.form.elements[button.dataset.choiceTarget];button.classList.toggle('active',String(input?.value??'')===String(button.dataset.choiceValue??''));});
  el.form.querySelectorAll('[data-time-label]').forEach(label=>{const name=label.dataset.timeLabel,input=el.form.elements[name],button=label.closest('[data-now-target]');if(input?.value){label.textContent=input.value+' 기록됨';button?.classList.add('recorded');}});
  el.form.querySelectorAll('[data-step-output]').forEach(output=>{const input=el.form.elements[output.dataset.stepOutput];output.textContent=input?.value||'0';});
  const status=el.form.elements.status,details=el.form.querySelector('[data-status-details]');if(status&&details)details.hidden=status.value==='NORMAL';
}

function val(fd,key){const v=fd.get(key);return v===''?null:v;}
function num(fd,key){const v=fd.get(key);return v===''||v==null?0:Number(v);}
function dateTime(t){return t?`${state.date}T${t}:00`:null;}
function minutesBetween(a,b){if(!a||!b)return 0;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);return Math.max(0,(bh*60+bm)-(ah*60+am));}
el.form.addEventListener('submit',async e=>{
  e.preventDefault();const type=el.form.dataset.type,fd=new FormData(el.form);const submit=el.form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='저장 중…';
  try{
    if(type==='site'){await api('POST','/care/operations/sites',{name:val(fd,'name'),address:val(fd,'address'),owner_name:val(fd,'owner_name'),phone:val(fd,'phone')});closeModal();showToast('운영 사업장을 등록했습니다');await loadSites(true);return;}
    const base={site_id:Number(state.siteId)};
    if(type==='equipment'){const customCategory=String(val(fd,'custom_category')||'').trim();await api('POST','/care/operations/equipment',{...base,category:customCategory||val(fd,'category'),model:val(fd,'model'),serial_number:val(fd,'serial_number'),installed_at:val(fd,'installed_at'),warranty_ends_at:val(fd,'warranty_ends_at')});closeModal();showToast('내 장비를 등록했습니다');await loadAll();return;}
    if(type==='day')await api('POST','/care/operations/day',{...base,operation_date:state.date,opened_at:val(fd,'opened_at'),closed_at:val(fd,'closed_at'),reserved_count:num(fd,'reserved_count'),staff_count:num(fd,'staff_count'),weather:val(fd,'weather'),busiest_period:val(fd,'busiest_period'),status:val(fd,'status'),owner_work_minutes:num(fd,'owner_work_minutes'),owner_memo:val(fd,'owner_memo')});
    if(type==='vehicle'){
      const arrived=val(fd,'arrived_at'),started=val(fd,'started_at'),finished=val(fd,'finished_at'),departed=val(fd,'departed_at');
      await api('POST','/care/operations/vehicles',{...base,job_date:state.date,plate_number:val(fd,'plate_number'),vehicle_model:val(fd,'vehicle_model'),vehicle_size:val(fd,'vehicle_size'),manual_size_override:el.form.elements.vehicle_size?.dataset.source==='수동 선택',arrived_at:dateTime(arrived),started_at:dateTime(started),finished_at:dateTime(finished),departed_at:dateTime(departed),work_minutes:minutesBetween(started,finished),wait_minutes:minutesBetween(arrived,started),base_work:val(fd,'base_work')||'기본 손세차',extra_work:val(fd,'extra_work'),assigned_staff:val(fd,'assigned_staff'),special_contamination:val(fd,'special_contamination'),customer_request:val(fd,'customer_request'),return_note:val(fd,'return_note'),payment_amount:num(fd,'payment_amount'),owner_involved:val(fd,'owner_involved')==='1',conditions:collectVehicleConditions()});
    }
    if(type==='rework')await api('POST','/care/operations/reworks',{...base,vehicle_job_id:val(fd,'vehicle_job_id')?Number(val(fd,'vehicle_job_id')):null,occurred_date:state.date,plate_number:val(fd,'manual_plate_number')||val(fd,'plate_number'),complaint_area:val(fd,'complaint_area'),customer_request:val(fd,'customer_request'),initial_worker:val(fd,'initial_worker'),inspector:val(fd,'inspector'),free_minutes:num(fd,'free_minutes'),cause:val(fd,'cause'),result:val(fd,'result'),prevention_action:val(fd,'prevention_action')});
    if(type==='issue'){if(!val(fd,'equipment_id'))throw new Error('장비를 먼저 등록해 주세요');await api('POST','/care/operations/equipment-issues',{...base,equipment_id:Number(val(fd,'equipment_id')),occurred_date:state.date,issue_title:val(fd,'issue_title_detail')||val(fd,'issue_title'),state:val(fd,'state'),downtime_minutes:num(fd,'downtime_minutes'),action_taken:val(fd,'action_taken'),note:val(fd,'note')});}
    if(type==='note')await api('POST','/care/operations/notes',{...base,note_date:state.date,content:val(fd,'content'),category:val(fd,'category')});
    closeModal();showToast('운영 기록을 저장했습니다');await loadAll();
  }catch(err){showToast(err.message,true);submit.disabled=false;submit.textContent='저장';}
});
async function resolveIssue(id){try{await api('PUT',`/care/operations/equipment-issues/${id}/resolve`);showToast('장비 문제를 해결 처리했습니다');await loadAll();}catch(e){showToast(e.message,true);}}

el.site.addEventListener('change',()=>{state.siteId=el.site.value;localStorage.setItem('wash_ops_site_id',state.siteId);loadAll();});
el.date.addEventListener('change',()=>{state.date=el.date.value||localDate();loadAll();});
document.querySelector('#addSiteBtn').addEventListener('click',()=>openForm('site'));
loadSites().catch(renderError);
</script>
