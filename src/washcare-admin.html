<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WashCare 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* design.skl.kr #13 "Write Post PC" 기반 (화이트+민트 #0FA3A3, 사이드바 내비, 카드형 패널) */
  * { box-sizing: border-box; }
  body { font-family: 'Manrope', -apple-system, "Segoe UI", sans-serif; background:#E4E7E9; color:#22292E; margin:0; }
  .topbar { background:#FFFFFF; border-bottom:1px solid #E7ECED; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:17px; margin:0; font-weight:800; color:#22292E; }
  .topbar input { background:#F4F6F6; border:1px solid #E7ECED; color:#22292E; padding:8px 12px; border-radius:9px; font-size:12.5px; width:220px; font-family:inherit; }
  .shell { display:flex; align-items:flex-start; min-height:calc(100vh - 53px); }
  aside.sidebar { width:220px; flex-shrink:0; background:#FFFFFF; border-right:1px solid #E7ECED; padding:22px 16px; }
  .sidebar-label { font-size:11px; font-weight:800; color:#8B979B; text-transform:uppercase; letter-spacing:.4px; padding:0 10px; margin:18px 0 8px; }
  .sidebar-label:first-child { margin-top:0; }
  nav { display:flex; flex-direction:column; gap:2px; }
  nav button { text-align:left; background:transparent; border:none; color:#69767B; padding:11px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit; }
  nav button.active { background:#EAF6F5; color:#0FA3A3; font-weight:800; }
  nav button.ghost { color:#0FA3A3; }
  main { flex:1; min-width:0; padding:28px 32px 40px; background:#F4F6F6; }
  .row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { background:#FFFFFF; border:1px solid #E7ECED; color:#22292E; padding:10px 12px; border-radius:9px; font-size:13.5px; font-family:inherit; }
  button.primary { background:#0FA3A3; color:#FFFFFF; border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#F1F4F4; border:none; color:#69767B; padding:10px 18px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px; background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #EFF2F2; }
  th { color:#8B979B; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.3px; background:#FAFBFB; }
  tr:hover td { background:#F7FAFA; cursor:pointer; }
  tr:last-child td { border-bottom:none; }
  .badge { padding:4px 11px; border-radius:9999px; font-size:11px; font-weight:800; }
  .b-RECEIVED { background:#F1F4F4; color:#69767B; }
  .b-SCHEDULED { background:#FFF4E5; color:#B4780A; }
  .b-IN_PROGRESS { background:#EAF6F5; color:#0FA3A3; }
  .b-COMPLETED { background:#E8F7EF; color:#1C9A5B; }
  .b-CANCELLED { background:#FDEEEE; color:#D64545; }
  .panel { background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; padding:24px; margin-top:0; }
  .msg { min-height:20px; color:#B4780A; font-size:13px; margin:0 0 12px; font-weight:600; }
  .token-box { display:flex; gap:8px; align-items:center; background:#F4F6F6; padding:10px 12px; border-radius:9px; font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; border:1px solid #E7ECED; }
  h2 { font-size:16px; color:#22292E; margin:0 0 16px; font-weight:800; }
  label { display:block; font-size:12px; color:#8B979B; margin-bottom:4px; font-weight:700; }
  #content { max-width:100%; overflow-x:auto; }

  @media (max-width: 780px) {
    .topbar { padding:12px 14px; }
    .topbar input { width:150px; }
    .shell { flex-direction:column; min-height:0; }
    aside.sidebar { width:100%; border-right:none; border-bottom:1px solid #E7ECED; padding:12px; }
    .sidebar-label { display:none; }
    aside.sidebar nav { flex-direction:row; overflow-x:auto; gap:6px; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    aside.sidebar nav button { white-space:nowrap; flex:0 0 auto; }
    main { padding:16px 14px 28px; }
    .panel { padding:16px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>WashCare 관리자</h1>
  <input id="apiKey" type="password" placeholder="API 키 (x-api-key)">
</div>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-label">현황</div>
    <nav>
      <button data-view="today" class="active">오늘 접수</button>
      <button data-view="progress">진행중</button>
      <button data-view="done">완료</button>
      <button data-view="search">고객검색</button>
      <button data-view="outreach">홍보 대상</button>
      <button data-view="warranty">보증 임박</button>
      <div class="sidebar-label">작성</div>
      <button data-view="new" class="ghost">+ 접수 생성</button>
      <button data-view="newpart" class="ghost">+ 부품판매</button>
      <button data-view="newsale" class="ghost">+ 판매 등록</button>
    </nav>
  </aside>
  <main>
    <div class="msg" id="msg"></div>
    <div id="content"></div>
  </main>
</div>
<script>
const KEY_STORAGE = 'washcare_admin_key';
const apiKeyInput = document.querySelector('#apiKey');
apiKeyInput.value = localStorage.getItem(KEY_STORAGE) || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem(KEY_STORAGE, apiKeyInput.value.trim()));

const msg = document.querySelector('#msg');
const content = document.querySelector('#content');

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'x-api-key': apiKeyInput.value.trim() } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function badge(status) {
  return `<span class="badge b-${status}">${status}</span>`;
}

function ticketRow(t) {
  return `<tr onclick="showDetail(${t.id})">
    <td>#${t.id}</td>
    <td>${t.site_name || ''}</td>
    <td>${t.symptom || ''}</td>
    <td>${t.priority || ''}</td>
    <td>${badge(t.status)}</td>
    <td>${t.scheduled_at || '-'}</td>
  </tr>`;
}

async function loadTickets(status, todayOnly) {
  msg.textContent = '불러오는 중...';
  try {
    const q = 'status=' + encodeURIComponent(status) + (todayOnly ? '&today=1' : '');
    const res = await api('GET', '/care/tickets?' + q);
    msg.textContent = '';
    const rows = res.data.map(ticketRow).join('');
    content.innerHTML = `<table><thead><tr>
      <th>ID</th><th>사업장</th><th>증상</th><th>우선순위</th><th>상태</th><th>예정일</th>
    </tr></thead><tbody>${rows || '<tr><td colspan="6">없음</td></tr>'}</tbody></table>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function showDetail(id) {
  msg.textContent = '불러오는 중...';
  try {
    const res = await api('GET', '/care/tickets/' + id);
    msg.textContent = '';
    const t = res.data.ticket;
    const visits = res.data.visits.map(v => `<li>${v.visited_at} — ${v.technician}: ${v.diagnosis || ''} / ${v.action_taken || ''} (인건비 ${v.labor_cost}, 부품비 ${v.parts_cost})</li>`).join('');
    const history = res.data.history.map(h => `<li>${h.changed_at}: ${h.old_status || '-'} → ${h.new_status}</li>`).join('');
    const nextOptions = { RECEIVED: ['SCHEDULED','IN_PROGRESS','CANCELLED'], SCHEDULED: ['IN_PROGRESS','CANCELLED'], IN_PROGRESS: ['COMPLETED','CANCELLED'] }[t.status] || [];
    content.innerHTML = `<div class="panel">
      <h2>티켓 #${t.id} — ${badge(t.status)}</h2>
      <p>고객: ${t.customer_name} / 사업장: ${t.site_name} (${t.address || ''}, ${t.contact_phone || ''})</p>
      <p>증상: ${t.symptom}</p>
      <div class="row">
        ${nextOptions.map(s => `<button class="ghost" onclick="changeStatus(${t.id}, '${s}')">${s}로 변경</button>`).join('')}
        <button class="ghost" onclick="reissueLink(${t.id})">공개 링크 재발급</button>
      </div>
      <h2>방문 이력</h2>
      <ul>${visits || '<li>없음</li>'}</ul>
      <h2>상태 변경 이력</h2>
      <ul>${history || '<li>없음</li>'}</ul>
      <button class="ghost" onclick="loadTickets('${t.status}', false)">목록으로</button>
    </div>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function changeStatus(id, status) {
  try {
    await api('PUT', '/care/tickets/' + id + '/status', { status });
    showDetail(id);
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function reissueLink(id) {
  try {
    const res = await api('POST', '/care/tickets/' + id + '/link/reissue');
    const token = res.data.public_token;
    content.insertAdjacentHTML('afterbegin', `<div class="panel">
      <h2>재발급된 토큰 (한 번만 표시됨)</h2>
      <div class="token-box"><span id="tk">${token}</span>
        <button class="ghost" onclick="navigator.clipboard.writeText(document.querySelector('#tk').textContent)">복사</button>
      </div>
    </div>`);
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function loadSearch() {
  content.innerHTML = `<div class="row">
    <input id="searchQ" placeholder="고객명 또는 전화번호">
    <button class="primary" onclick="runSearch()">검색</button>
  </div><div id="searchResult"></div>`;
}

async function runSearch() {
  const q = document.querySelector('#searchQ').value;
  try {
    const res = await api('GET', '/care/customers?q=' + encodeURIComponent(q));
    const rows = res.data.map(c => `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.phone || ''}</td><td>${c.email || ''}</td><td>${c.migration_status}</td></tr>`).join('');
    document.querySelector('#searchResult').innerHTML = `<table><thead><tr>
      <th>ID</th><th>이름</th><th>연락처</th><th>이메일</th><th>상태</th>
    </tr></thead><tbody>${rows || '<tr><td colspan="5">없음</td></tr>'}</tbody></table>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

function loadNewTicketForm() {
  content.innerHTML = `<div class="panel">
    <h2>새 A/S 접수</h2>
    <div class="row"><div><label>사업장 ID</label><input id="f-site"></div>
    <div><label>장비 ID (선택)</label><input id="f-equipment"></div></div>
    <div class="row"><div><label>증상</label><input id="f-symptom" style="width:300px"></div></div>
    <div class="row">
      <div><label>우선순위</label><select id="f-priority">
        <option>LOW</option><option selected>NORMAL</option><option>HIGH</option><option>URGENT</option>
      </select></div>
      <div><label>접수경로</label><select id="f-source">
        <option selected>PHONE</option><option>MESSAGE</option><option>WEB</option><option>INTERNAL</option>
      </select></div>
      <div><label>예정일시</label><input id="f-scheduled" type="datetime-local"></div>
    </div>
    <button class="primary" onclick="createTicket()">접수 생성</button>
    <div id="newResult"></div>
  </div>`;
}

async function createTicket() {
  try {
    const body = {
      site_id: Number(document.querySelector('#f-site').value),
      equipment_id: document.querySelector('#f-equipment').value ? Number(document.querySelector('#f-equipment').value) : null,
      symptom: document.querySelector('#f-symptom').value,
      priority: document.querySelector('#f-priority').value,
      source: document.querySelector('#f-source').value,
      scheduled_at: document.querySelector('#f-scheduled').value || null
    };
    const res = await api('POST', '/care/tickets', body);
    const token = res.data.public_token;
    document.querySelector('#newResult').innerHTML = `<p>생성됨: #${res.data.id}</p>
      <div class="token-box"><span id="tk2">${token}</span>
        <button class="ghost" onclick="navigator.clipboard.writeText(document.querySelector('#tk2').textContent)">복사</button>
      </div>
      <p style="color:#f59e0b">이 토큰은 지금만 표시됩니다 — 고객에게 바로 전달하세요.</p>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function loadOutreach() {
  msg.textContent = '불러오는 중...';
  try {
    const res = await api('GET', '/care/outreach/due');
    msg.textContent = '';
    const rows = res.data.map(o => `<tr>
      <td>${o.site_name}</td><td>${o.contact_phone || ''}</td>
      <td>${o.touch_type}</td><td>${o.channel}</td><td>${(o.next_touch_at || '').slice(0,10)}</td>
      <td>
        <button class="ghost" onclick="respondOutreach(${o.id}, 'POSITIVE')">긍정</button>
        <button class="ghost" onclick="respondOutreach(${o.id}, 'NEGATIVE')">부정</button>
        <button class="ghost" onclick="respondOutreach(${o.id}, 'NO_RESPONSE')">무응답(30일 후 재접촉)</button>
      </td>
    </tr>`).join('');
    content.innerHTML = `<table><thead><tr>
      <th>사업장</th><th>연락처</th><th>유형</th><th>채널</th><th>접촉예정일</th><th>기록</th>
    </tr></thead><tbody>${rows || '<tr><td colspan="6">접촉 대상 없음</td></tr>'}</tbody></table>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function respondOutreach(id, response) {
  try {
    const next = new Date(Date.now() + (response === 'NO_RESPONSE' ? 30 : 90) * 86400000).toISOString();
    await api('POST', '/care/outreach/' + id + '/response', {
      response, converted_to: null, converted_ref_id: null,
      next_touch_at: response === 'NEGATIVE' ? null : next
    });
    loadOutreach();
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

function loadNewPartSaleForm() {
  content.innerHTML = `<div class="panel">
    <h2>부품판매 등록</h2>
    <div class="row"><div><label>사업장 ID</label><input id="p-site"></div>
    <div><label>장비 ID (선택)</label><input id="p-equipment"></div></div>
    <div class="row"><div><label>부품명</label><input id="p-name"></div>
    <div><label>수량</label><input id="p-qty" type="number" value="1"></div>
    <div><label>단가</label><input id="p-price" type="number"></div>
    <div><label>채널</label><select id="p-channel"><option value="STORE" selected>매장</option><option value="ONLINE">온라인</option></select></div></div>
    <button class="primary" onclick="createPartSale()">판매 등록</button>
    <div id="partResult"></div>
  </div>`;
}

async function createPartSale() {
  try {
    const body = {
      site_id: Number(document.querySelector('#p-site').value),
      equipment_id: document.querySelector('#p-equipment').value ? Number(document.querySelector('#p-equipment').value) : null,
      ticket_id: null,
      part_name: document.querySelector('#p-name').value,
      quantity: Number(document.querySelector('#p-qty').value || 1),
      unit_price: Number(document.querySelector('#p-price').value || 0),
      channel: document.querySelector('#p-channel').value
    };
    const res = await api('POST', '/care/part-sales', body);
    document.querySelector('#partResult').innerHTML = `<p>등록됨: #${res.data.id} — 총액 ${res.data.total_price.toLocaleString()}원</p>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function loadWarranty() {
  msg.textContent = '불러오는 중...';
  try {
    const res = await api('GET', '/care/warranty-expiring?days=30');
    msg.textContent = '';
    const rows = res.data.map(e => `<tr>
      <td>${e.site_name}</td><td>${e.contact_phone || ''}</td>
      <td>${e.model}</td><td>${e.category}</td><td>${e.warranty_ends_at}</td>
      <td><button class="ghost" onclick="quickOutreach(${e.site_id}, ${e.id})">교체제안 접촉 예약</button></td>
    </tr>`).join('');
    content.innerHTML = `<p style="color:#94a3b8">30일 이내 보증 만료 — 재구매·교체판매 제안 대상</p>
    <table><thead><tr>
      <th>사업장</th><th>연락처</th><th>모델</th><th>종류</th><th>보증만료일</th><th></th>
    </tr></thead><tbody>${rows || '<tr><td colspan="6">없음</td></tr>'}</tbody></table>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function quickOutreach(siteId, equipmentId) {
  try {
    const next = new Date(Date.now() + 3 * 86400000).toISOString();
    await api('POST', '/care/outreach', { site_id: siteId, equipment_id: equipmentId, touch_type: 'REPLACEMENT_OFFER', channel: 'PHONE', next_touch_at: next });
    msg.textContent = '교체제안 접촉이 3일 후로 예약됐습니다.';
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

function loadNewSaleForm() {
  content.innerHTML = `<div class="panel">
    <h2>판매 등록 (견적·계약 → 고객/사업장 → 장비 → 관리링크 → 첫 접촉 예약)</h2>
    <div class="row"><div><label>기존 고객 ID (있으면, 없으면 비워서 신규)</label><input id="s-customer-id"></div></div>
    <div class="row">
      <div><label>고객명(신규 시)</label><input id="s-customer-name"></div>
      <div><label>연락처(신규 시)</label><input id="s-customer-phone"></div>
      <div><label>이메일(신규 시)</label><input id="s-customer-email"></div>
    </div>
    <div class="row">
      <div><label>사업장명</label><input id="s-site-name"></div>
      <div><label>주소</label><input id="s-site-address"></div>
      <div><label>연락처</label><input id="s-site-phone"></div>
    </div>
    <div class="row">
      <div><label>장비 종류</label><input id="s-eq-category" value="세차기"></div>
      <div><label>모델</label><input id="s-eq-model"></div>
      <div><label>일련번호</label><input id="s-eq-serial"></div>
      <div><label>설치일</label><input id="s-eq-installed" type="date"></div>
      <div><label>보증만료일</label><input id="s-eq-warranty" type="date"></div>
    </div>
    <div class="row"><div><label>첫 접촉까지(일)</label><input id="s-first-days" type="number" value="90"></div></div>
    <button class="primary" onclick="createSale()">판매 등록</button>
    <div id="saleResult"></div>
  </div>`;
}

async function createSale() {
  try {
    const customerId = document.querySelector('#s-customer-id').value;
    const body = {
      customer_id: customerId ? Number(customerId) : null,
      customer_name: document.querySelector('#s-customer-name').value,
      customer_phone: document.querySelector('#s-customer-phone').value,
      customer_email: document.querySelector('#s-customer-email').value,
      site_name: document.querySelector('#s-site-name').value,
      site_address: document.querySelector('#s-site-address').value,
      site_contact_phone: document.querySelector('#s-site-phone').value,
      contract_id: null,
      equipment: [{
        category: document.querySelector('#s-eq-category').value,
        model: document.querySelector('#s-eq-model').value,
        serial_number: document.querySelector('#s-eq-serial').value,
        installed_at: document.querySelector('#s-eq-installed').value || null,
        warranty_ends_at: document.querySelector('#s-eq-warranty').value || null
      }],
      first_outreach_days: Number(document.querySelector('#s-first-days').value || 90)
    };
    const res = await api('POST', '/care/sales', body);
    const token = res.data.site_public_token;
    document.querySelector('#saleResult').innerHTML = `<p>등록됨 — 사업장 #${res.data.site_id}, 고객 #${res.data.customer_id}</p>
      <p>장비관리 링크(고객에게 전달):</p>
      <div class="token-box"><span id="tk3">${location.origin}/care/site-status/${token}</span>
        <button class="ghost" onclick="navigator.clipboard.writeText(document.querySelector('#tk3').textContent)">복사</button>
      </div>
      <p style="color:#f59e0b">이 링크는 지금만 표시됩니다.</p>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

document.querySelectorAll('nav button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    if (view === 'today') loadTickets('RECEIVED', true);
    else if (view === 'progress') loadTickets('IN_PROGRESS', false);
    else if (view === 'done') loadTickets('COMPLETED', false);
    else if (view === 'search') loadSearch();
    else if (view === 'outreach') loadOutreach();
    else if (view === 'warranty') loadWarranty();
    else if (view === 'new') loadNewTicketForm();
    else if (view === 'newpart') loadNewPartSaleForm();
    else if (view === 'newsale') loadNewSaleForm();
  });
});

loadTickets('RECEIVED', true);
</script>
</body>
</html>
