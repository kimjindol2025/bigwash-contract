  main { flex:1; min-width:0; padding:28px 32px 40px; background:#F4F6F6; }
  .row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { background:#FFFFFF; border:1px solid #E7ECED; color:#22292E; padding:10px 12px; border-radius:9px; font-size:13.5px; font-family:inherit; }

<script>
const KEY_STORAGE = 'washcare_admin_key';
const apiKeyInput = document.querySelector('#apiKey');
apiKeyInput.value = localStorage.getItem(KEY_STORAGE) || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem(KEY_STORAGE, apiKeyInput.value.trim()));

const msg = document.querySelector('#msg');
const content = document.querySelector('#content');

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'x-api-key': apiKeyInput.value.trim() } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function badge(status) {
  return `<span class="badge b-${status}">${status}</span>`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function pad2(value) {
  return String(value).padStart(2, '0');
}

function toLocalDateInputValue(date = new Date()) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function toLocalDateTimeInputValue(date = new Date()) {
  return `${toLocalDateInputValue(date)}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}

}

  DRAFT: ['SENT'],

  REVISION_REQUESTED: ['SENT', 'ON_HOLD', 'REJECTED'],
  ON_HOLD: ['REVIEWING'],
};

function actionAttrs(action, args = [], options = {}) {
  const attrs = [
    `data-action="${escapeHtml(action)}"`,
    `data-args="${escapeHtml(JSON.stringify(args))}"`
  ];
  if (options.stopPropagation) attrs.push('data-stop-propagation="1"');
  return attrs.join(' ');
}

function emptyStateRow(colspan, title = '없음', description = '표시할 데이터가 아직 없습니다.') {

async function loadTickets(status, todayOnly) {
  msg.textContent = '불러오는 중...';
  try {
    const q = 'status=' + encodeURIComponent(status) + (todayOnly ? '&today=1' : '');
    const res = await api('GET', '/care/tickets?' + q);
    msg.textContent = '';
    const rows = res.data.map(ticketRow).join('');
    content.innerHTML = `<table><thead><tr>
      <th>ID</th><th>사업장</th><th>증상</th><th>우선순위</th><th>상태</th><th>예정일</th>
    </tr></thead><tbody>${rows || emptyStateRow(6, '접수 없음', '조건에 맞는 티켓이 아직 없습니다.')}</tbody></table>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function showDetail(id) {
  msg.textContent = '불러오는 중...';
  try {
    const res = await api('GET', '/care/tickets/' + id);
    msg.textContent = '';
    const t = res.data.ticket;
    const visits = res.data.visits.map(v => `<li>${v.visited_at} — ${v.technician}: ${v.diagnosis || ''} / ${v.action_taken || ''} (인건비 ${v.labor_cost}, 부품비 ${v.parts_cost})</li>`).join('');
    const history = res.data.history.map(h => `<li>${h.changed_at}: ${h.old_status || '-'} → ${h.new_status}</li>`).join('');
    const nextOptions = { RECEIVED: ['SCHEDULED','IN_PROGRESS','CANCELLED'], SCHEDULED: ['IN_PROGRESS','CANCELLED'], IN_PROGRESS: ['COMPLETED','CANCELLED'] }[t.status] || [];
    content.innerHTML = `<div class="panel">
      <h2>티켓 #${t.id} — ${badge(t.status)}</h2>
      <p>고객: ${t.customer_name} / 사업장: ${t.site_name} (${t.address || ''}, ${t.contact_phone || ''})</p>
      <p>증상: ${t.symptom}</p>
      <div class="row">
        ${nextOptions.map(s => `<button class="ghost" ${actionAttrs('changeStatus', [t.id, s])}>${s}로 변경</button>`).join('')}
        <button class="ghost" ${actionAttrs('reissueLink', [t.id])}>공개 링크 재발급</button>
      </div>
      <h2>방문 이력</h2>
      ${visits ? `<ul>${visits}</ul>` : emptyState('방문 이력 없음', '아직 등록된 방문 기록이 없습니다.')}
      <h2>상태 변경 이력</h2>
      ${history ? `<ul>${history}</ul>` : emptyState('상태 변경 이력 없음', '아직 기록된 상태 변경 내역이 없습니다.')}
      <button class="ghost" ${actionAttrs('loadTickets', [t.status, false])}>목록으로</button>
    </div>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function changeStatus(id, status) {
  try {
    await api('PUT', '/care/tickets/' + id + '/status', { status });
    showDetail(id);
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

async function reissueLink(id) {
  try {

    content.insertAdjacentHTML('afterbegin', `<div class="panel">

  let tabContent = '';
  if (currentCustomerTab === 'basic') tabContent = renderBasicTab(currentCustomerDetail);

  else if (currentCustomerTab === 'equipment') tabContent = renderEquipmentTab(currentCustomerDetail);
  else if (currentCustomerTab === 'quotes') tabContent = renderQuotesTab(currentCustomerDetail);
  else if (currentCustomerTab === 'contracts') tabContent = renderContractsTab(currentCustomerDetail);
  else if (currentCustomerTab === 'tickets') tabContent = renderTicketsTab(currentCustomerDetail);
  else if (currentCustomerTab === 'sales') tabContent = renderSalesTab(currentCustomerDetail);
  else if (currentCustomerTab === 'contacts') tabContent = renderContactsTab(currentCustomerDetail);

async function createCustomer() {
  try {
    const body = {
      name: document.querySelector('#c-name').value,
      phone: document.querySelector('#c-phone').value,
      email: '',
      memo: document.querySelector('#c-memo').value,
      customer_type: document.querySelector('#c-type').value,
      address: document.querySelector('#c-address').value
    };
    const res = await api('POST', '/care/customers', body);
    msg.textContent = '고객이 등록되었습니다.';
    viewCustomer(res.data.id);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
}

async function viewCustomer(id, selectedTab) {
  msg.textContent = '불러오는 중...';
  try {
    const [customerRes, consultationsRes, sitesRes, equipmentRes, quotesRes, contractsRes, ticketsRes, salesRes, contactsRes, tasksRes, followupsRes] = await Promise.all([
      api('GET', '/care/customers/' + id),
      api('GET', '/care/consultations?customer_id=' + id),
      api('GET', '/care/sites?customer_id=' + id),
      api('GET', '/care/equipment?customer_id=' + id),
      api('GET', '/care/quotes?customer_id=' + id),
      api('GET', '/care/contracts?customer_id=' + id),
      api('GET', '/care/tickets?customer_id=' + id),
      api('GET', '/care/part-sales?customer_id=' + id),
      api('GET', '/care/customer-contacts?customer_id=' + id),
      api('GET', '/care/customer-tasks?customer_id=' + id),
      api('GET', '/care/customer-followups?customer_id=' + id)
    ]);
    msg.textContent = '';
    currentCustomerId = id;
    currentCustomerTab = selectedTab || 'basic';
    currentCustomerDetail = {
      customer: customerRes.data,
      consultations: consultationsRes.data,
      sites: sitesRes.data,
      equipment: equipmentRes.data,
      quotes: quotesRes.data,
      contracts: contractsRes.data,
      tickets: ticketsRes.data,
      sales: salesRes.data,
      contacts: contactsRes.data,
      tasks: tasksRes.data,
      followups: followupsRes.data
    };
    renderCustomerDetail();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
}

async function respondOutreach(id, response) {
  try {
    const next = new Date(Date.now() + (response === 'NO_RESPONSE' ? 30 : 90) * 86400000).toISOString();
    await api('POST', '/care/outreach/' + id + '/response', {
      response, converted_to: null, converted_ref_id: null,
      next_touch_at: response === 'NEGATIVE' ? null : next
    });
    loadOutreach();
  } catch (e) { msg.textContent = '오류: ' + e.message; }
}

      <p style="color:#f59e0b">이 링크는 지금만 표시됩니다.</p>`;
  } catch (e) { msg.textContent = '오류: ' + e.message; }

async function copyTextFromSelector(selector) {
  const target = document.querySelector(selector);
  if (!target) {
    msg.textContent = '오류: 복사 대상 요소를 찾지 못했습니다.';
    return;
  }
  try {
    await navigator.clipboard.writeText(target.textContent || '');
    msg.textContent = '복사되었습니다.';
  } catch (e) {
    msg.textContent = '오류: 복사에 실패했습니다.';
  }
}

document.addEventListener('click', async (event) => {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  if (actionEl.dataset.stopPropagation === '1') event.stopPropagation();
  event.preventDefault();

  let args = [];
  try {
    args = actionEl.dataset.args ? JSON.parse(actionEl.dataset.args) : [];
  } catch (e) {
    msg.textContent = '오류: action args 파싱에 실패했습니다.';
    return;
  }

  const fn = globalThis[actionEl.dataset.action];
  if (typeof fn !== 'function') {
    msg.textContent = '오류: action handler를 찾지 못했습니다.';
    return;
  }

  try {
    await fn(...args);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
});
