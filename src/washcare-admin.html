<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대한이엔지 통합관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* design.skl.kr #13 구조를 유지하되, 2026-07-19 기준 기본 강조색은 보라/레드 체계 */
  * { box-sizing: border-box; }
  body { font-family: 'Manrope', -apple-system, "Segoe UI", sans-serif; background:#E4E7E9; color:#22292E; margin:0; }
  .topbar { background:#FFFFFF; border-bottom:1px solid #E7ECED; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .topbar-title { display:flex; flex-direction:column; gap:2px; }
  .topbar h1 { font-size:17px; margin:0; font-weight:800; color:#22292E; }
  .topbar-sub { font-size:12px; color:#8B979B; font-weight:700; }
  .topbar input { background:#F4F6F6; border:1px solid #E7ECED; color:#22292E; padding:8px 12px; border-radius:9px; font-size:12.5px; width:220px; font-family:inherit; }
  .shell { display:flex; align-items:flex-start; min-height:calc(100vh - 53px); }
  aside.sidebar { width:220px; flex-shrink:0; background:#FFFFFF; border-right:1px solid #E7ECED; padding:22px 16px; }
  .sidebar-label { font-size:11px; font-weight:800; color:#8B979B; text-transform:uppercase; letter-spacing:.4px; padding:0 10px; margin:18px 0 8px; }
  .sidebar-label:first-child { margin-top:0; }
  nav { display:flex; flex-direction:column; gap:2px; }
  nav button { text-align:left; background:transparent; border:none; color:#69767B; padding:11px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit; }
  nav button.active { background:#EFEAFB; color:#6C4CE0; font-weight:800; }
  nav button.ghost { color:#6C4CE0; }
  main { flex:1; min-width:0; padding:28px 32px 40px; background:#F4F6F6; }
  .row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { background:#FFFFFF; border:1px solid #E7ECED; color:#22292E; padding:10px 12px; border-radius:9px; font-size:13.5px; font-family:inherit; }
  button.primary { background:#6C4CE0; color:#FFFFFF; border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#F1F4F4; border:none; color:#69767B; padding:10px 18px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px; background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #EFF2F2; }
  th { color:#8B979B; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.3px; background:#FAFBFB; }
  tr:hover td { background:#F7FAFA; cursor:pointer; }
  tr:last-child td { border-bottom:none; }
  .badge { padding:4px 11px; border-radius:9999px; font-size:11px; font-weight:800; }
  .b-RECEIVED { background:#F1F4F4; color:#69767B; }
  .b-SCHEDULED { background:#FFF4E5; color:#B4780A; }
  .b-IN_PROGRESS { background:#EFEAFB; color:#6C4CE0; }
  .b-DRAFT { background:#F1F4F4; color:#69767B; }
  .b-SENT { background:#E9F5FF; color:#226BA5; }
  .b-REVIEWING { background:#EFEAFB; color:#6C4CE0; }
  .b-REVISION_REQUESTED { background:#FFF4E5; color:#B4780A; }
  .b-APPROVED { background:#E8F7EF; color:#1C9A5B; }
  .b-ON_HOLD { background:#FDEEEE; color:#D64545; }
  .b-REJECTED { background:#FDEEEE; color:#D64545; }
  .b-CONVERTED { background:#E7ECED; color:#445158; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:16px; }
  .stat-card { border-radius:18px; padding:22px; color:#FFFFFF; min-height:140px; display:flex; flex-direction:column; justify-content:space-between; }
  .stat-card-red { background:#E85454; }
  .stat-card-purple { background:#6C4CE0; }
  .stat-card-amber { background:#D9891F; }
  .stat-card-blue { background:#2E7FC1; }
  .stat-card { cursor:pointer; }
  .stat-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .stat-card-label { font-size:12px; font-weight:700; opacity:.84; letter-spacing:.2px; }
  .stat-card-icon { width:34px; height:34px; border-radius:9999px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
  .stat-card-value { font-size:30px; line-height:1.1; font-weight:800; letter-spacing:-.3px; }
  .stat-card-note { font-size:12px; opacity:.82; }
  .b-COMPLETED { background:#E8F7EF; color:#1C9A5B; }
  .b-CANCELLED { background:#FDEEEE; color:#D64545; }
  .b-ACTIVE { background:#E8F7EF; color:#1C9A5B; }
  .b-EXPIRED { background:#FFF4E5; color:#B4780A; }
  .b-RENEWED { background:#E9F5FF; color:#226BA5; }
  .panel { background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; padding:24px; margin-top:0; }
  .placeholder-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
  .placeholder-card { background:#FBFAFE; border:1px solid #E6E0FA; border-left:4px solid #6C4CE0; border-radius:14px; padding:16px 16px 16px 14px; min-height:108px; }
  .placeholder-card-title { margin:0; font-size:14px; font-weight:800; color:#31285A; line-height:1.5; }
  .badge-pending { background:#FFF4E5; color:#B4780A; }
  .empty-state { margin-top:12px; padding:28px 18px; border:1px dashed #D9E0E3; border-radius:14px; background:#FBFCFC; color:#7B878C; text-align:center; }
  .empty-state-title { margin:0 0 6px; font-size:14px; font-weight:800; color:#5C666C; }
  .empty-state-text { margin:0; font-size:13px; line-height:1.5; }
  .tab-bar { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; margin:18px 0 20px; padding-bottom:6px; scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
  .tab-bar button { flex-shrink:0; white-space:nowrap; }
  .tab-panel { margin-top:18px; }
  .info-card { background:#FFFFFF; border:1px solid #E7ECED; border-left:4px solid #6C4CE0; border-radius:14px; padding:18px 20px; margin-bottom:18px; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px 24px; }
  .info-row { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .info-row-label { font-size:11.5px; font-weight:700; color:#8B979B; }
  .info-row-value { font-size:13.5px; font-weight:700; color:#22292E; overflow-wrap:break-word; }
  .stat-chip-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:10px; margin-top:16px; }
  .stat-chip { background:#FBFAFE; border:1px solid #E6E0FA; border-radius:12px; padding:12px 10px; text-align:center; }
  .stat-chip-value { font-size:18px; font-weight:800; color:#6C4CE0; }
  .stat-chip-label { font-size:11px; font-weight:700; color:#8B979B; margin-top:2px; }
  .msg { min-height:20px; color:#B4780A; font-size:13px; margin:0 0 12px; font-weight:600; }
  .token-box { display:flex; gap:8px; align-items:center; background:#F4F6F6; padding:10px 12px; border-radius:9px; font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; border:1px solid #E7ECED; }
  h2 { font-size:16px; color:#22292E; margin:0 0 16px; font-weight:800; }
  label { display:block; font-size:12px; color:#8B979B; margin-bottom:4px; font-weight:700; }
  #content { max-width:100%; overflow-x:auto; }
  .company-footer { padding:28px 32px; color:#CAD2D5; background:#22292E; border-top:1px solid #364147; }
  .company-footer-inner { max-width:1280px; margin:0 auto; display:grid; gap:12px; }
  .company-footer-contact { display:flex; align-items:center; gap:8px 22px; flex-wrap:wrap; }
  .company-footer-label { color:#8B979B; font-size:12px; font-weight:700; }
  .company-footer-phone { color:#FFFFFF; font-size:18px; font-weight:800; text-decoration:none; }
  .company-footer-details { display:flex; gap:7px 20px; flex-wrap:wrap; font-size:12.5px; line-height:1.65; }
  .company-footer-details span { overflow-wrap:anywhere; }

  @media (max-width: 780px) {
    .topbar { padding:12px 14px; }
    .topbar input { width:150px; font-size:16px; }
    .shell { flex-direction:column; min-height:0; }
    aside.sidebar { width:100%; border-right:none; border-bottom:1px solid #E7ECED; padding:12px; }
    .sidebar-label { display:none; }
    aside.sidebar nav { flex-direction:row; overflow-x:auto; gap:6px; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    aside.sidebar nav button { white-space:nowrap; flex:0 0 auto; min-height:44px; }
    main { padding:16px 14px 28px; }
    .panel { padding:16px; }

    /* 폼 필드: 16px 미만이면 iOS Safari가 입력창 탭할 때 자동으로 화면을 확대한다 */
    input, select, textarea { font-size:16px; }

    /* .row 안에서 나란히 놓이던 필드를 세로로 꽉 채워 쌓는다 — 두 손가락 줌 없이 바로 탭 가능하게 */
    .row > div { flex: 1 1 100%; }
    .row > input, .row > select, .row > textarea,
    .row > div > input, .row > div > select, .row > div > textarea { width: 100%; }

    /* 터치 타깃 44px 미만 방지 (iOS/Android 권장 최소 터치 영역) */
    button.primary, button.ghost { min-height: 44px; }

    /* 표: 좁은 화면에서 글자 크기를 살짝 줄이고, 첫 컬럼을 고정해 가로 스크롤 중에도
       어느 행인지 계속 보이게 한다 */
    table { font-size: 12.5px; }
    th, td { padding: 10px 10px; }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      box-shadow: 2px 0 4px -2px rgba(0,0,0,.12);
    }
    th:first-child { background: #FAFBFB; }
    td:first-child { background: #FFFFFF; }
    .company-footer { padding:24px 14px; }
    .company-footer-contact, .company-footer-details { display:grid; gap:7px; }
    .company-footer-phone { min-height:44px; display:inline-flex; align-items:center; font-size:17px; }
  }
</style>
</head>

<script>
const KEY_STORAGE = 'washcare_admin_key';
const apiKeyInput = document.querySelector('#apiKey');
apiKeyInput.value = localStorage.getItem(KEY_STORAGE) || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem(KEY_STORAGE, apiKeyInput.value.trim()));

const msg = document.querySelector('#msg');
const content = document.querySelector('#content');

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'x-api-key': apiKeyInput.value.trim() } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function badge(status) {
  const safe = escapeHtml(status || '');
  return `<span class="badge b-${safe}">${safe}</span>`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function pad2(value) {
  return String(value).padStart(2, '0');
}

function toLocalDateInputValue(date = new Date()) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function toLocalDateTimeInputValue(date = new Date()) {
  return `${toLocalDateInputValue(date)}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}

function customerTypeLabel(type) {
  return {
    LEAD: '잠재고객',
    CUSTOMER: '거래고객',
    SERVICE: '서비스고객',
    VENDOR: '거래처',
  }[type] || type || '-';
}

function consultationMethodLabel(method) {
  return {
    PHONE: '전화',
    SMS: '문자',
    KAKAO: '카카오',
    VISIT: '방문',
    OTHER: '기타',
  }[method] || method || '-';
}

function contactRoleLabel(role) {
  return {
    OWNER: '대표자',
    MANAGER: '관리자',
    SITE_MANAGER: '현장담당자',
    ACCOUNTING: '회계담당자',
    PURCHASING: '구매담당자',
    FACILITY: '시설담당자',
    OTHER: '기타',
  }[role] || role || '-';
}

function nextActionLabel(action) {
  return {
    NONE: '없음',
    CALLBACK: '다시 연락',
    QUOTE: '견적 작성',
    SERVICE_TICKET: '출장 접수',
    SALE: '상품 판매',
    CONTRACT_REVIEW: '계약 검토',
  }[action] || action || '-';
}

function taskPriorityLabel(priority) {
  return {
    LOW: '낮음',
    NORMAL: '보통',
    HIGH: '높음',
  }[priority] || priority || '-';
}

function taskStatusLabel(status) {
  return {
    PENDING: '대기',
    IN_PROGRESS: '진행중',
    DONE: '완료',
    DELAYED: '지연',
    CANCELLED: '취소',
  }[status] || status || '-';
}

function followupTypeLabel(type) {
  return {
    CONSULT_RECALL: '상담 재연락',
    QUOTE_CHECK: '견적 확인',
    INSTALL_CHECK: '설치 확인',
    SERVICE_CHECK: '서비스 확인',
    REPAIR_RECHECK: '수리 재점검',
    PAYMENT_NOTICE: '입금 안내',
    CONSUMABLE_NOTICE: '소모품 안내',
    WARRANTY_END_NOTICE: '보증 종료 안내',
    CARE_PLAN_RENEWAL: '연간관리 갱신',
    LONG_TERM_INACTIVE: '장기 미활동',
  }[type] || type || '-';
}

function quoteStatusLabel(status) {
  return {
    DRAFT: '작성중',
    SENT: '발송',
    REVIEWING: '검토중',
    REVISION_REQUESTED: '수정요청',
    APPROVED: '승인',
    ON_HOLD: '보류',
    REJECTED: '거절',
    CONVERTED: '계약전환',
  }[status] || status || '-';
}

function timelineTypeLabel(type) {
  return {
    CONSULTATION: '상담',
    SALE: '판매',
    QUOTE: '견적',
    CONTRACT: '계약',
    TICKET: '출장',
    FOLLOWUP: '사후관리',
  }[type] || type || '-';
}

function carePlanCodeLabel(code) {
  return {
    TRIAL_90: 'TRIAL 90일',
    BASIC_360: 'BASIC 36만원·365일',
    FIELD_790: 'FIELD 79만원·365일',
  }[code] || code || '-';
}

function carePlanEffectiveStatus(plan) {
  return (plan && (plan.effective_status || plan.status)) || '-';
}

function carePlanStatusBadge(plan) {
  return badge(carePlanEffectiveStatus(plan));
}

function carePlanRemainingVisits(plan) {
  const included = Number(plan && plan.included_visits) || 0;
  const used = Number(plan && plan.used_visits) || 0;
  return included - used;
}

function parseIntegerValue(rawValue, options) {
  const { fieldName, required = false, allowNegative = false, allowEmpty = false } = options;
  const text = String(rawValue ?? '').trim();
  if (text === '') {
    if (allowEmpty) return null;
    throw new Error(`${fieldName}는 필수입니다.`);
  }
  if (!/^-?\d+$/.test(text)) {
    throw new Error(`${fieldName}는 정수만 허용합니다.`);
  }
  const value = Number(text);
  if (!Number.isFinite(value) || !Number.isSafeInteger(value)) {
    throw new Error(`${fieldName}는 유효한 정수가 아닙니다.`);
  }
  if (!allowNegative && value < 0) {
    throw new Error(`${fieldName}는 0 이상 정수여야 합니다.`);
  }
  return value;
}

function parsePositiveInteger(rawValue, fieldName) {
  const value = parseIntegerValue(rawValue, { fieldName, required: true, allowNegative: false });
  if (value <= 0) throw new Error(`${fieldName}는 1 이상의 정수여야 합니다.`);
  return value;
}

function parseNonNegativeInteger(rawValue, fieldName, allowEmpty = false) {
  return parseIntegerValue(rawValue, { fieldName, required: !allowEmpty, allowNegative: false, allowEmpty });
}

function parseCarePlanOptionalInteger(rawValue, fieldName) {
  return parseNonNegativeInteger(rawValue, fieldName, true);
}

function parseCarePlanUsedVisits(rawValue, includedVisits) {
  const used = parseNonNegativeInteger(rawValue, '사용 횟수', false);
  const included = parseNonNegativeInteger(includedVisits, '포함 방문횟수', true);
  if (included != null && used > included) {
    throw new Error('사용 횟수는 포함 방문횟수를 초과할 수 없습니다.');
  }
  return used;
}

const QUOTE_NEXT = {
  DRAFT: ['SENT'],
  SENT: ['REVIEWING', 'ON_HOLD', 'REJECTED'],
  REVIEWING: ['REVISION_REQUESTED', 'APPROVED', 'ON_HOLD', 'REJECTED'],
  REVISION_REQUESTED: ['SENT', 'ON_HOLD', 'REJECTED'],
  ON_HOLD: ['REVIEWING'],
};

function actionAttrs(action, args = [], options = {}) {
  const attrs = [
    `data-action="${escapeHtml(action)}"`,
    `data-args="${escapeHtml(JSON.stringify(args))}"`
  ];
  if (options.stopPropagation) attrs.push('data-stop-propagation="1"');
  return attrs.join(' ');
}

const CUSTOMER_FILTERS = [

function readCarePlanEnrollForm(idPrefix, siteId) {
  const price = document.querySelector('#' + idPrefix + '-price').value;
  const visits = document.querySelector('#' + idPrefix + '-visits').value;
  return {
    site_id: siteId,
    plan_code: document.querySelector('#' + idPrefix + '-plan').value,
    starts_at: document.querySelector('#' + idPrefix + '-starts').value || null,
    price_snapshot: parseCarePlanOptionalInteger(price, '가격'),
    included_visits: parseCarePlanOptionalInteger(visits, '포함 방문횟수'),
    next_inspection_at: document.querySelector('#' + idPrefix + '-inspection').value || null,
    memo: document.querySelector('#' + idPrefix + '-memo').value || null,

}

function readCarePlanUsedVisitsInput(inputId, includedVisits) {
  const input = document.querySelector('#' + inputId);

  return parseCarePlanUsedVisits(input.value, includedVisits);
}

async function loadCarePlans() {
  msg.textContent = '불러오는 중...';
  try {
    const res = await api('GET', '/care/care-plans');
    msg.textContent = '';
    currentCarePlanRows = res.data || [];
    renderCarePlanHome();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
    content.innerHTML = `<div class="panel"><h2>연간관리</h2>${emptyState('불러오지 못했습니다', e.message)}</div>`;
  }
}

function setCarePlanFilter(filter) {
  currentCarePlanFilter = filter;
  renderCarePlanHome();
}

async function createCarePlan() {
  if (carePlanBusy) return;
  carePlanBusy = true;
  try {
    const siteId = parsePositiveInteger(document.querySelector('#cp-new-site').value, '현장 ID');
    await api('POST', '/care/care-plans', readCarePlanEnrollForm('cp-new', siteId));
    msg.textContent = '가입이 저장되었습니다.';
    await loadCarePlans();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    carePlanBusy = false;
  }
}

async function updateCarePlanUsedVisits(id, customerId) {
  if (carePlanBusy) return;
  carePlanBusy = true;
  try {
    const plan = currentCarePlanRows.find(p => p.id === id) || (currentCustomerDetail && currentCustomerDetail.carePlans || []).find(p => p.id === id);
    const moduleInputId = 'cp-used-' + id;
    const customerInputId = 'cp-c-used-' + id;
    const inputId = document.querySelector('#' + moduleInputId) ? moduleInputId : customerInputId;
    const usedVisits = readCarePlanUsedVisitsInput(inputId, plan ? plan.included_visits : null);
    await api('PUT', '/care/care-plans/' + id, { used_visits: usedVisits });
    msg.textContent = '사용 횟수가 저장되었습니다.';
    if (customerId) await viewCustomer(customerId, 'careplans'); else await loadCarePlans();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    carePlanBusy = false;
  }
}

async function cancelCarePlan(id, customerId) {
  if (carePlanBusy) return;
  if (!confirm('이 연간관리 가입을 취소할까요? 취소 후에는 되돌릴 수 없습니다.')) return;
  carePlanBusy = true;
  try {
    await api('PUT', '/care/care-plans/' + id + '/cancel', {});
    msg.textContent = '가입이 취소되었습니다.';
    if (customerId) await viewCustomer(customerId, 'careplans'); else await loadCarePlans();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    carePlanBusy = false;
  }
}

      memo: document.querySelector('#c-memo').value,

    const res = await api('POST', '/care/customers', body);

}

async function viewCustomer(id, selectedTab) {
  msg.textContent = '불러오는 중...';
  // 요청 identity guard: 응답을 받을 때 여전히 최신 조회 요청인지 토큰으로 확인해
  // 고객 A 조회 중 고객 B로 빠르게 이동해도 늦게 도착한 A 응답이 B 화면을 덮지 않게 한다.
  const requestToken = ++customerDetailRequestToken;
  try {
    const [customerRes, consultationsRes, timelineRes, sitesRes, equipmentRes, quotesRes, contractsRes, ticketsRes, salesRes, contactsRes, tasksRes, followupsRes, carePlansRes] = await Promise.all([
      api('GET', '/care/customers/' + id),
      api('GET', '/care/consultations?customer_id=' + id),
      api('GET', '/care/timeline?customer_id=' + id + '&type=ALL'),
      api('GET', '/care/sites?customer_id=' + id),
      api('GET', '/care/equipment?customer_id=' + id),
      api('GET', '/care/quotes?customer_id=' + id),
      api('GET', '/care/contracts?customer_id=' + id),
      api('GET', '/care/tickets?customer_id=' + id),
      api('GET', '/care/part-sales?customer_id=' + id),
      api('GET', '/care/customer-contacts?customer_id=' + id),
      api('GET', '/care/customer-tasks?customer_id=' + id),
      api('GET', '/care/customer-followups?customer_id=' + id),
      api('GET', '/care/care-plans?customer_id=' + id)
    ]);
    if (requestToken !== customerDetailRequestToken) return;
    msg.textContent = '';
    currentCustomerId = id;
    currentCustomerTab = selectedTab || 'basic';
    currentTimelineType = 'ALL';
    currentCustomerDetail = {
      customer: customerRes.data,
      consultations: consultationsRes.data,
      timeline: timelineRes.data,
      sites: sitesRes.data,
      equipment: equipmentRes.data,
      quotes: quotesRes.data,
      contracts: contractsRes.data,
      tickets: ticketsRes.data,
      sales: salesRes.data,
      contacts: contactsRes.data,
      tasks: tasksRes.data,
      followups: followupsRes.data,
      carePlans: carePlansRes.data
    };
    renderCustomerDetail();
  } catch (e) {
    if (requestToken !== customerDetailRequestToken) return;
    msg.textContent = '오류: ' + e.message;
  }
}

async function setCustomerTimelineType(type) {
  if (!currentCustomerId || !currentCustomerDetail) return;
  const requestToken = ++customerTimelineRequestToken;
  const requestCustomerId = currentCustomerId;
  try {
    const res = await api('GET', '/care/timeline?customer_id=' + currentCustomerId + '&type=' + encodeURIComponent(type));
    if (requestToken !== customerTimelineRequestToken) return;
    if (requestCustomerId !== currentCustomerId) return;
    currentTimelineType = type;
    currentCustomerDetail.timeline = res.data;
    renderCustomerDetail();
  } catch (e) {
    if (requestToken !== customerTimelineRequestToken) return;
    msg.textContent = '오류: ' + e.message;
  }
}

// 표시 전용 배너: 현장의 연간관리 이용 현황을 안내만 하며, 할인/과금/방문
// 자동차감·접수 차단은 절대 하지 않는다. 요청 토큰으로 site_id를 빠르게
// 바꿔도 늦게 도착한 이전 응답이 배너를 덮어쓰지 않게 막는다.
async function refreshTicketCarePlanBanner(siteIdRaw) {
  const requestToken = ++ticketCarePlanRequestToken;
  const banner = document.querySelector('#ticketCarePlanBanner');
  if (!banner) return;
  const siteId = Number(siteIdRaw);
  if (!siteIdRaw || !Number.isFinite(siteId) || siteId <= 0) {
    banner.style.display = 'none';
    banner.innerHTML = '';
    return;
  }
  banner.style.display = '';
  banner.textContent = '연간관리 확인 중...';
  try {
    const res = await api('GET', '/care/care-plans?site_id=' + siteId);
    if (requestToken !== ticketCarePlanRequestToken) return;
    const freshBanner = document.querySelector('#ticketCarePlanBanner');
    if (!freshBanner) return;
    const active = (res.data || []).find(p => carePlanEffectiveStatus(p) === 'ACTIVE');
    if (active) {
      freshBanner.innerHTML = `연간관리 이용 중 — ${escapeHtml(carePlanCodeLabel(active.plan_code))} · 잔여 ${escapeHtml(String(carePlanRemainingVisits(active)))}회 · ~${escapeHtml(active.ends_at || '-')}`;
    } else {
      freshBanner.textContent = '연간관리 미가입';
    }
  } catch (e) {
    if (requestToken !== ticketCarePlanRequestToken) return;
    const freshBanner = document.querySelector('#ticketCarePlanBanner');
    if (freshBanner) freshBanner.textContent = '연간관리 확인 실패: ' + e.message;
  }
}

async function copyTextFromSelector(selector) {
  const target = document.querySelector(selector);
  if (!target) {
    msg.textContent = '오류: 복사 대상 요소를 찾지 못했습니다.';
    return;
  }
  try {

    msg.textContent = '복사되었습니다.';
  } catch (e) {
    msg.textContent = '오류: 복사에 실패했습니다.';

}

document.addEventListener('click', async (event) => {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  if (actionEl.dataset.stopPropagation === '1') event.stopPropagation();
  event.preventDefault();

  let args = [];
  try {
    args = actionEl.dataset.args ? JSON.parse(actionEl.dataset.args) : [];
  } catch (e) {
    msg.textContent = '오류: action args 파싱에 실패했습니다.';
    return;
  }

  const fn = globalThis[actionEl.dataset.action];
  if (typeof fn !== 'function') {
    msg.textContent = '오류: action handler를 찾지 못했습니다.';
    return;
  }

  try {
    await fn(...args);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
});

    const view = btn.dataset.view;
    if (view === 'home') loadOpsSummary();
    else if (view === 'today') loadTickets('RECEIVED', true);
    else if (view === 'progress') loadTickets('IN_PROGRESS', false);
    else if (view === 'done') loadTickets('COMPLETED', false);
    else if (view === 'customers') loadCustomerHome();
    else if (view === 'products') loadModulePlaceholder(MODULE_PLACEHOLDERS.products.title, MODULE_PLACEHOLDERS.products.description, MODULE_PLACEHOLDERS.products.outline);
    else if (view === 'quotes') loadModulePlaceholder(MODULE_PLACEHOLDERS.quotes.title, MODULE_PLACEHOLDERS.quotes.description, MODULE_PLACEHOLDERS.quotes.outline);
    else if (view === 'contracts') loadModulePlaceholder(MODULE_PLACEHOLDERS.contracts.title, MODULE_PLACEHOLDERS.contracts.description, MODULE_PLACEHOLDERS.contracts.outline);
    else if (view === 'outreach') loadOutreach();
    else if (view === 'warranty') loadWarranty();
    else if (view === 'careplan') loadCarePlans();
    else if (view === 'accounting') loadModulePlaceholder(MODULE_PLACEHOLDERS.accounting.title, MODULE_PLACEHOLDERS.accounting.description, MODULE_PLACEHOLDERS.accounting.outline);
    else if (view === 'messages') loadModulePlaceholder(MODULE_PLACEHOLDERS.messages.title, MODULE_PLACEHOLDERS.messages.description, MODULE_PLACEHOLDERS.messages.outline);
    else if (view === 'todos') loadModulePlaceholder(MODULE_PLACEHOLDERS.todos.title, MODULE_PLACEHOLDERS.todos.description, MODULE_PLACEHOLDERS.todos.outline);
    else if (view === 'files') loadModulePlaceholder(MODULE_PLACEHOLDERS.files.title, MODULE_PLACEHOLDERS.files.description, MODULE_PLACEHOLDERS.files.outline);
    else if (view === 'reports') loadOpsWeekly();
    else if (view === 'settings') loadModulePlaceholder(MODULE_PLACEHOLDERS.settings.title, MODULE_PLACEHOLDERS.settings.description, MODULE_PLACEHOLDERS.settings.outline);
    else if (view === 'newcustomer') loadNewCustomerForm();
    else if (view === 'new') loadNewTicketForm();
    else if (view === 'newpart') loadNewPartSaleForm();
    else if (view === 'newsale') loadNewSaleForm();
  });
});

loadTickets('RECEIVED', true);
</script>
</body>
</html>
