<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대한이엔지 통합관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* design.skl.kr #13 구조를 유지하되, 2026-07-19 기준 기본 강조색은 보라/레드 체계 */
  * { box-sizing: border-box; }
  body { font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif; background:#E4E7E9; color:#22292E; margin:0; }
  .topbar { background:#FFFFFF; border-bottom:1px solid #E7ECED; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .topbar-title { display:flex; flex-direction:column; gap:2px; }
  .topbar h1 { font-size:17px; margin:0; font-weight:800; color:#22292E; }
  .topbar-sub { font-size:12px; color:#8B979B; font-weight:700; }
  .topbar input { background:#F4F6F6; border:1px solid #E7ECED; color:#22292E; padding:8px 12px; border-radius:9px; font-size:12.5px; width:220px; font-family:inherit; }
  .mobile-menu-toggle { display:none; align-items:center; justify-content:center; min-width:76px; min-height:44px; padding:8px 14px; border:1px solid #DDD6F6; border-radius:10px; color:#5D41C7; background:#F7F4FF; font:800 13px/1 'Manrope', -apple-system, "Segoe UI", sans-serif; cursor:pointer; }
  .shell { display:flex; align-items:flex-start; min-height:calc(100vh - 53px); }
  aside.sidebar { width:220px; flex-shrink:0; background:#FFFFFF; border-right:1px solid #E7ECED; padding:22px 16px; }
  .sidebar-label { font-size:11px; font-weight:800; color:#8B979B; text-transform:uppercase; letter-spacing:.4px; padding:0 10px; margin:18px 0 8px; }
  .sidebar-label:first-child { margin-top:0; }
  nav { display:flex; flex-direction:column; gap:2px; }
  nav button { text-align:left; background:transparent; border:none; color:#69767B; padding:11px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit; }
  nav button.active { background:#EFEAFB; color:#6C4CE0; font-weight:800; }
  nav button.ghost { color:#6C4CE0; }
  main { flex:1; min-width:0; padding:28px 32px 40px; background:#F4F6F6; }
  .row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { background:#FFFFFF; border:1px solid #E7ECED; color:#22292E; padding:10px 12px; border-radius:9px; font-size:13.5px; font-family:inherit; }
  button.primary { background:#6C4CE0; color:#FFFFFF; border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#F1F4F4; border:none; color:#69767B; padding:10px 18px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px; background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #EFF2F2; }
  th { color:#8B979B; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.3px; background:#FAFBFB; }
  tr:hover td { background:#F7FAFA; cursor:pointer; }
  tr:last-child td { border-bottom:none; }
  .badge { padding:4px 11px; border-radius:9999px; font-size:11px; font-weight:800; }
  .b-RECEIVED { background:#F1F4F4; color:#69767B; }
  .b-SCHEDULED { background:#FFF4E5; color:#B4780A; }
  .b-IN_PROGRESS { background:#EFEAFB; color:#6C4CE0; }
  .b-DRAFT { background:#F1F4F4; color:#69767B; }
  .b-SENT { background:#E9F5FF; color:#226BA5; }
  .b-REVIEWING { background:#EFEAFB; color:#6C4CE0; }
  .b-REVISION_REQUESTED { background:#FFF4E5; color:#B4780A; }
  .b-APPROVED { background:#E8F7EF; color:#1C9A5B; }
  .b-ON_HOLD { background:#FDEEEE; color:#D64545; }
  .b-REJECTED { background:#FDEEEE; color:#D64545; }
  .b-CONVERTED { background:#E7ECED; color:#445158; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:16px; }
  .stat-card { border-radius:18px; padding:22px; color:#FFFFFF; min-height:140px; display:flex; flex-direction:column; justify-content:space-between; }
  .stat-card-red { background:#E85454; }
  .stat-card-purple { background:#6C4CE0; }
  .stat-card-amber { background:#D9891F; }
  .stat-card-blue { background:#2E7FC1; }
  .stat-card { cursor:pointer; }
  .stat-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .stat-card-label { font-size:12px; font-weight:700; opacity:.84; letter-spacing:.2px; }
  .stat-card-icon { width:34px; height:34px; border-radius:9999px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
  .stat-card-value { font-size:30px; line-height:1.1; font-weight:800; letter-spacing:-.3px; }
  .stat-card-note { font-size:12px; opacity:.82; }
  .b-COMPLETED { background:#E8F7EF; color:#1C9A5B; }
  .b-CANCELLED { background:#FDEEEE; color:#D64545; }
  .b-ACTIVE { background:#E8F7EF; color:#1C9A5B; }
  .b-EXPIRED { background:#FFF4E5; color:#B4780A; }
  .b-RENEWED { background:#E9F5FF; color:#226BA5; }
  .b-CANDIDATE { background:#FFF4E5; color:#9A6200; }
  .b-OPERATING { background:#E8F7EF; color:#167A48; }
  .b-REJECTED { background:#F1F4F4; color:#69767B; }
  .b-DRAFT { background:#F4F6F6; color:#5C666C; }
  .b-PENDING { background:#FFF4E5; color:#B4780A; }
  .b-APPROVED { background:#E9F5FF; color:#226BA5; }
  .panel { background:#FFFFFF; border:1px solid #E7ECED; border-radius:14px; padding:24px; margin-top:0; }
  @media print {
    .topbar, aside.sidebar, .no-print { display:none !important; }
    .shell { display:block; }
    main { padding:0; }
    .panel { border:none; box-shadow:none; }
  }
  .placeholder-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
  .placeholder-card { background:#FBFAFE; border:1px solid #E6E0FA; border-left:4px solid #6C4CE0; border-radius:14px; padding:16px 16px 16px 14px; min-height:108px; }
  .placeholder-card-title { margin:0; font-size:14px; font-weight:800; color:#31285A; line-height:1.5; }
  .badge-pending { background:#FFF4E5; color:#B4780A; }
  .empty-state { margin-top:12px; padding:28px 18px; border:1px dashed #D9E0E3; border-radius:14px; background:#FBFCFC; color:#7B878C; text-align:center; }
  .empty-state-title { margin:0 0 6px; font-size:14px; font-weight:800; color:#5C666C; }
  .empty-state-text { margin:0; font-size:13px; line-height:1.5; }
  .tab-bar { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; margin:18px 0 20px; padding-bottom:6px; scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
  .tab-bar button { flex-shrink:0; white-space:nowrap; }
  .tab-panel { margin-top:18px; }
  .info-card { background:#FFFFFF; border:1px solid #E7ECED; border-left:4px solid #6C4CE0; border-radius:14px; padding:18px 20px; margin-bottom:18px; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px 24px; }
  .info-row { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .info-row-label { font-size:11.5px; font-weight:700; color:#8B979B; }
  .info-row-value { font-size:13.5px; font-weight:700; color:#22292E; overflow-wrap:break-word; }
  .stat-chip-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:10px; margin-top:16px; }
  .stat-chip { background:#FBFAFE; border:1px solid #E6E0FA; border-radius:12px; padding:12px 10px; text-align:center; }
  .stat-chip-value { font-size:18px; font-weight:800; color:#6C4CE0; }
  .stat-chip-label { font-size:11px; font-weight:700; color:#8B979B; margin-top:2px; }
  .msg { min-height:20px; color:#B4780A; font-size:13px; margin:0 0 12px; font-weight:600; }
  .token-box { display:flex; gap:8px; align-items:center; background:#F4F6F6; padding:10px 12px; border-radius:9px; font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; border:1px solid #E7ECED; }
  .site-checklist-host { margin-top:18px; scroll-margin-top:76px; }
  .site-checklist-shell { padding:20px; border:1px solid #DDD6F6; border-radius:14px; background:#FBFAFE; }
  .site-checklist-title { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .site-checklist-title h2 { margin-bottom:4px; }
  .site-checklist-address { margin:0; color:#69767B; font-size:13px; line-height:1.5; }
  .checklist-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
  .checklist-item { padding:14px; border:1px solid #E7ECED; border-radius:12px; background:#FFFFFF; }
  .checklist-item-title { display:block; margin-bottom:9px; color:#31285A; font-size:14px; font-weight:800; }
  .checklist-item select, .checklist-item input { width:100%; }
  .checklist-item input { margin-top:8px; }
  .checklist-history { display:grid; gap:10px; margin-top:14px; }
  .checklist-history-card { overflow:hidden; border:1px solid #E0E6E8; border-radius:12px; background:#FFFFFF; }
  .checklist-history-card summary { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; cursor:pointer; font-weight:800; list-style:none; }
  .checklist-history-card summary::-webkit-details-marker { display:none; }
  .checklist-history-body { padding:0 14px 14px; }
  .checklist-history-item { display:grid; grid-template-columns:minmax(120px, .7fr) minmax(100px, .5fr) minmax(0, 1fr); gap:10px; padding:9px 0; border-bottom:1px solid #EFF2F2; font-size:13px; line-height:1.5; }
  .checklist-history-item:last-child { border-bottom:0; }
  .checklist-history-label { font-weight:800; color:#526268; }
  .checklist-overall-PASS { background:#E8F7EF; color:#167A48; }
  .checklist-overall-ATTENTION { background:#FFF4E5; color:#9A6200; }
  .checklist-overall-FAIL { background:#FDEEEE; color:#B82E2E; }
  h2 { font-size:16px; color:#22292E; margin:0 0 16px; font-weight:800; }
  label { display:block; font-size:12px; color:#8B979B; margin-bottom:4px; font-weight:700; }
  #content { max-width:100%; overflow-x:auto; }
  .company-footer { padding:28px 32px; color:#CAD2D5; background:#22292E; border-top:1px solid #364147; }
  .company-footer-inner { max-width:1280px; margin:0 auto; display:grid; gap:12px; }
  .company-footer-contact { display:flex; align-items:center; gap:8px 22px; flex-wrap:wrap; }
  .company-footer-label { color:#8B979B; font-size:12px; font-weight:700; }
  .company-footer-phone { color:#FFFFFF; font-size:18px; font-weight:800; text-decoration:none; }
  .company-footer-details { display:flex; gap:7px 20px; flex-wrap:wrap; font-size:12.5px; line-height:1.65; }
  .company-footer-details span { overflow-wrap:anywhere; }

  @media (max-width: 780px) {
    body { overflow-x:hidden; font-size:16px; line-height:1.6; letter-spacing:-.015em; }
    .topbar {
      position:sticky; top:0; z-index:30; padding:10px 14px 12px;
      display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:10px 12px;
    }
    .topbar-title { min-width:0; justify-content:center; }
    .topbar h1 { overflow:hidden; font-size:18px; line-height:1.3; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.04em; }
    .topbar-sub { font-size:13px; color:#627278; }
    .topbar input { grid-column:1 / -1; width:100%; min-height:46px; font-size:16px; }
    .mobile-menu-toggle { display:inline-flex; font-size:16px; }
    .shell { flex-direction:column; min-height:0; }
    aside.sidebar { display:none; width:100%; border-right:none; border-bottom:1px solid #E7ECED; padding:14px; }
    aside.sidebar.mobile-open { display:block; }
    .sidebar-label { display:block; grid-column:1 / -1; padding:10px 4px 2px; margin:4px 0 0; font-size:13px; color:#627278; }
    .sidebar-label:first-child { margin-top:4px; }
    aside.sidebar nav { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
    aside.sidebar nav button { min-height:50px; padding:11px 12px; text-align:center; white-space:normal; font-size:16px; line-height:1.4; }
    main { width:100%; min-width:0; padding:16px 12px 30px; }
    #content { min-width:0; overflow-x:visible; }
    .panel { max-width:100%; padding:18px 14px; border-radius:14px; overflow:hidden; }
    .panel + .panel { margin-top:14px; }
    h2 { margin-bottom:18px; font-size:20px; line-height:1.4; letter-spacing:-.035em; }
    .panel p, .empty-state-text { font-size:16px; line-height:1.7; color:#4F6067; }
    .msg { min-height:22px; margin-bottom:14px; font-size:15px; line-height:1.5; }
    .row { flex-direction:column; gap:10px; margin-bottom:14px; }

    /* 폼 필드: 16px 미만이면 iOS Safari가 입력창 탭할 때 자동으로 화면을 확대한다 */
    input, select, textarea { width:100%; max-width:100%; min-height:50px; padding:12px 13px; font-size:16px; line-height:1.45; border-color:#CCD5D8; }
    textarea { min-height:104px; }
    label { margin-bottom:6px; font-size:14px; line-height:1.45; color:#526268; }

    /* .row 안에서 나란히 놓이던 필드를 세로로 꽉 채워 쌓는다 — 두 손가락 줌 없이 바로 탭 가능하게 */
    .row > div { flex: 1 1 100%; }
    .row > input, .row > select, .row > textarea,
    .row > div > input, .row > div > select, .row > div > textarea { width: 100%; }
    .row:not([role="group"]) > button { width:100%; }
    .row[role="group"] { flex-direction:row; flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .row[role="group"]::-webkit-scrollbar { display:none; }
    .row[role="group"] button { flex:0 0 auto; white-space:nowrap; }

    /* 터치 타깃 44px 미만 방지 (iOS/Android 권장 최소 터치 영역) */
    button.primary, button.ghost { min-height:48px; padding:11px 16px; font-size:16px; line-height:1.35; }
    .badge { padding:5px 10px; font-size:13px; line-height:1.35; }

    .stat-grid { grid-template-columns:1fr; gap:12px; }
    .stat-card { min-height:132px; padding:18px 16px; border-radius:15px; }
    .stat-card-label { font-size:15px; }
    .stat-card-icon { width:38px; height:38px; font-size:16px; }
    .stat-card-value { font-size:32px; }
    .stat-card-note { font-size:14px; line-height:1.5; }
    .placeholder-grid, .info-grid { grid-template-columns:1fr; gap:12px; }
    .placeholder-card, .info-card { padding:17px 15px; border-radius:13px; }
    .placeholder-card { min-height:0; }
    .placeholder-card-title { font-size:16px; line-height:1.55; }
    .info-row { gap:5px; }
    .info-row-label { font-size:13px; color:#627278; }
    .info-row-value { font-size:16px; line-height:1.55; }
    .stat-chip-row { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .stat-chip { padding:14px 10px; }
    .stat-chip-value { font-size:22px; }
    .stat-chip-label { font-size:13px; }
    .tab-bar { width:calc(100% + 28px); margin-left:-14px; margin-right:-14px; padding:0 14px 7px; scrollbar-width:none; }
    .tab-bar::-webkit-scrollbar { display:none; }
    .token-box { align-items:stretch; flex-direction:column; }
    .site-checklist-shell { padding:17px 14px; }
    .site-checklist-host { scroll-margin-top:132px; }
    .site-checklist-title { flex-direction:column; }
    .site-checklist-address { font-size:15px; }
    .checklist-grid { grid-template-columns:1fr; }
    .checklist-item { padding:15px 13px; }
    .checklist-item-title { font-size:16px; }
    .checklist-history-card summary { min-height:54px; padding:14px 12px; font-size:15px; }
    .checklist-history-item { grid-template-columns:minmax(92px, 42%) minmax(0, 1fr); gap:7px 12px; padding:11px 0; font-size:15px; }
    .checklist-history-item span:last-child { grid-column:1 / -1; color:#526268; }

    /* 모바일 표는 가로 스크롤 대신 한 행을 읽기 쉬운 항목 카드로 표시한다. */
    table.mobile-card-table { display:block; width:100%; max-width:100%; margin-top:14px; overflow:visible; border:0; border-radius:0; background:transparent; font-size:15px; white-space:normal; }
    table.mobile-card-table thead { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0, 0, 0, 0); white-space:nowrap; border:0; }
    table.mobile-card-table tbody { display:grid; min-width:0; gap:12px; }
    table.mobile-card-table tr { display:block; overflow:hidden; border:1px solid #DCE3E5; border-radius:13px; background:#FFFFFF; box-shadow:0 2px 8px rgba(34,41,46,.04); }
    table.mobile-card-table td { display:grid; grid-template-columns:minmax(92px, 40%) minmax(0, 1fr); gap:12px; align-items:center; min-height:48px; padding:11px 12px; border-bottom:1px solid #EDF1F2; font-size:15px; line-height:1.5; overflow-wrap:anywhere; }
    table.mobile-card-table td:last-child { border-bottom:0; }
    table.mobile-card-table td::before { content:attr(data-label); color:#607076; font-size:13px; font-weight:800; line-height:1.4; }
    table.mobile-card-table td[colspan] { display:block; min-height:0; padding:18px 14px; text-align:center; color:#526268; }
    table.mobile-card-table td[colspan]::before { content:none; }
    table.mobile-card-table td button { width:100%; }
    .company-footer { padding:24px 14px; }
    .company-footer-contact, .company-footer-details { display:grid; gap:7px; }
    .company-footer-label { font-size:14px; color:#AEBBC0; }
    .company-footer-phone { min-height:44px; display:inline-flex; align-items:center; font-size:22px; }
    .company-footer-details { gap:9px; font-size:15px; line-height:1.65; }
  }

  @media (max-width: 360px) {
    .stat-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">
    <h1>대한이엔지 통합관리시스템</h1>
    <span class="topbar-sub">WashCare 데이터 기반</span>
  </div>
  <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="mainSidebar">메뉴</button>
  <input id="apiKey" type="password" placeholder="API 키 (선택)">
</div>
<div class="shell">
  <aside class="sidebar" id="mainSidebar">
    <nav>
      <button data-view="home">홈</button>
      <div class="sidebar-label">고객</div>
      <button data-view="customers">고객관리</button>
      <div class="sidebar-label">영업</div>
      <button data-view="products">상품·판매</button>
      <button data-view="quotes">견적관리</button>
      <button data-view="contracts">계약관리</button>
      <div class="sidebar-label">서비스</div>
      <button data-view="today" class="active">오늘 접수</button>
      <button data-view="progress">진행중</button>
      <button data-view="done">완료</button>
      <button data-view="outreach">홍보 대상</button>
      <button data-view="warranty">보증 임박</button>
      <button data-view="careplan">연간관리</button>
      <button data-view="operations">세차장 운영 기록실</button>
      <div class="sidebar-label">관리</div>
      <button data-view="accounting">회계·수금</button>
      <button data-view="messages">메시지</button>
      <button data-view="todos">일정·할 일</button>
      <button data-view="files">사진·문서</button>
      <div class="sidebar-label">분석</div>
      <button data-view="reports">통계·보고서</button>
      <div class="sidebar-label">시스템</div>
      <button data-view="settings">설정</button>
      <div class="sidebar-label">작성</div>
      <button data-view="newcustomer" class="ghost">+ 고객 등록</button>
      <button data-view="new" class="ghost">+ 접수 생성</button>
      <button data-view="newpart" class="ghost">+ 부품판매</button>
      <button data-view="newsale" class="ghost">+ 판매 등록</button>
    </nav>
  </aside>
  <main>
    <div class="msg" id="msg"></div>
    <div id="content"></div>
  </main>
</div>
<footer class="company-footer" id="company-info">
  <div class="company-footer-inner">

function parseIntegerValue(rawValue, options) {
  const { fieldName, required = false, allowNegative = false, allowEmpty = false } = options;
  const text = String(rawValue ?? '').trim();
  if (text === '') {
    if (allowEmpty) return null;
    throw new Error(`${fieldName}는 필수입니다.`);
  }
  if (!/^-?\d+$/.test(text)) {
    throw new Error(`${fieldName}는 정수만 허용합니다.`);
  }
  const value = Number(text);
  if (!Number.isFinite(value) || !Number.isSafeInteger(value)) {
    throw new Error(`${fieldName}는 유효한 정수가 아닙니다.`);
  }
  if (!allowNegative && value < 0) {
    throw new Error(`${fieldName}는 0 이상 정수여야 합니다.`);
  }
  return value;
}

function parsePositiveInteger(rawValue, fieldName) {
  const value = parseIntegerValue(rawValue, { fieldName, required: true, allowNegative: false });
  if (value <= 0) throw new Error(`${fieldName}는 1 이상의 정수여야 합니다.`);
  return value;
}

function parseNonNegativeInteger(rawValue, fieldName, allowEmpty = false) {
  return parseIntegerValue(rawValue, { fieldName, required: !allowEmpty, allowNegative: false, allowEmpty });
}

function parseCarePlanOptionalInteger(rawValue, fieldName) {
  return parseNonNegativeInteger(rawValue, fieldName, true);
}

function parseCarePlanUsedVisits(rawValue, includedVisits) {
  const used = parseNonNegativeInteger(rawValue, '사용 횟수', false);
  const included = parseNonNegativeInteger(includedVisits, '포함 방문횟수', true);
  if (included != null && used > included) {
    throw new Error('사용 횟수는 포함 방문횟수를 초과할 수 없습니다.');
  }
  return used;
}

function parseRequiredPositiveId(raw, fieldName) {
  const text = String(raw ?? '').trim();
  if (text === '') {
    throw new Error(`${fieldName}는 필수입니다.`);
  }
  return parsePositiveInteger(text, fieldName);
}

async function createCarePlan() {
  if (carePlanBusy) return;

  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    carePlanBusy = false;
  }
}

    carePlanBusy = false;

}

function contractStatusLabel(status) {

    APPROVED: '승인',
    COMPLETED: '완료',
    CANCELLED: '취소',
  }[status] || status || '-';
}

function contractStatusBadge(status) {
  return `${badge(status)} <span>${escapeHtml(contractStatusLabel(status))}</span>`;
}

function contractNextStatuses(status) {
  return CONTRACT_NEXT[status] || [];
}

function contractWorkScheduleText(c) {
  const start = c && (c.work_starts_at || c.work_start_at);
  const end = c && (c.work_ends_at || c.work_end_at);
  if (!start && !end) return '-';
  return `${start || '?'} ~ ${end || '?'}`;
}

function formatContractMoney(value) {
  if (value == null || value === '') return '-';
  const n = Number(value);
  if (!Number.isFinite(n)) return String(value);
  return String(Math.trunc(n));
}

function contractListUrl() {
  const params = new URLSearchParams();
  if (currentContractFilter !== 'ALL') {
    params.set('status', currentContractFilter);
  }
  const q = (currentContractSearch || '').trim();
  if (q) {
    params.set('q', q);
  }
  const query = params.toString();
  return query ? `/care/contracts?${query}` : '/care/contracts';
}

function bindContractItemInputs() {
  const body = document.querySelector('#contract-items-body');
  if (!body || body.dataset.bound === '1') return;
  body.dataset.bound = '1';
  body.addEventListener('input', (event) => {
    const field = event.target && event.target.getAttribute('data-ci-field');
    if (field === 'quantity' || field === 'unit_price') recalcContractItemsTotal();
  });
}

function readContractItemsFromDom() {
  const rows = Array.from(document.querySelectorAll('[data-contract-item-row]'));
  if (rows.length < 1) throw new Error('계약 항목은 최소 1개여야 합니다.');
  return rows.map((row) => {
    const description = (row.querySelector('[data-ci-field="description"]')?.value || '').trim();
    const quantity = parsePositiveInteger(row.querySelector('[data-ci-field="quantity"]')?.value, '수량');
    const unitPrice = parseNonNegativeInteger(row.querySelector('[data-ci-field="unit_price"]')?.value, '단가');
    if (!description) throw new Error('항목 설명은 필수입니다.');
    return {
      description,
      quantity,
      unit_price: unitPrice,
      subtotal: quantity * unitPrice,
    };
  });
}

function recalcContractItemsTotal() {
  let total = 0;
  document.querySelectorAll('[data-contract-item-row]').forEach((row) => {
    const qRaw = row.querySelector('[data-ci-field="quantity"]')?.value;
    const pRaw = row.querySelector('[data-ci-field="unit_price"]')?.value;
    let sub = 0;
    try {
      const q = parsePositiveInteger(qRaw, '수량');
      const p = parseNonNegativeInteger(pRaw, '단가');
      sub = q * p;
      total += sub;
    } catch (e) {
      sub = 0;
    }
    const cell = row.querySelector('.ci-subtotal');
    if (cell) cell.textContent = String(sub);
  });
  const totalEl = document.querySelector('#contract-items-total');
  if (totalEl) totalEl.textContent = String(total);
  return total;
}

function addContractItemRow() {
  const tbody = document.querySelector('#contract-items-body');
  if (!tbody) return;
  contractItemRowSeq += 1;
  tbody.insertAdjacentHTML('beforeend', contractItemRowHtml({
    _rowId: 'ci-new-' + contractItemRowSeq,
    description: '',
    quantity: 1,
    unit_price: 0,
  }, true));
  recalcContractItemsTotal();
}

function removeContractItemRow(rowId) {
  const tbody = document.querySelector('#contract-items-body');
  if (!tbody) return;
  const rows = tbody.querySelectorAll('[data-contract-item-row]');
  if (rows.length <= 1) {
    msg.textContent = '오류: 계약 항목은 최소 1개여야 합니다.';
    return;
  }
  const target = Array.from(rows).find((row) => row.getAttribute('data-contract-item-row') === String(rowId));
  if (target) target.remove();
  recalcContractItemsTotal();
}

  msg.textContent = '불러오는 중...';

    const res = await api('GET', contractListUrl());

async function createContract() {
  if (contractBusy) return;

  try {

    const items = readContractItemsFromDom();

  const editable = c.status === 'DRAFT';
  const next = contractNextStatuses(c.status);
  const transitionButtons = next.map((status) => {
    const label = status === 'CANCELLED' ? '취소' : contractStatusLabel(status);
    return `<button type="button" class="ghost" ${actionAttrs('updateContractStatus', [c.id, status])}>${escapeHtml(label)}</button>`;

  content.innerHTML = `<div class="panel" id="contract-print-root">

      <div class="row" style="margin:0;">

async function openContractDetail(id) {
  msg.textContent = '불러오는 중...';
  const requestToken = ++contractDetailRequestToken;
  try {
    const res = await api('GET', '/care/contracts/' + id);
    if (requestToken !== contractDetailRequestToken) return;
    msg.textContent = '';
    const payload = res.data || res;
    const detail = payload.contract ? payload : { contract: payload, items: payload.items || [], history: payload.history || [] };
    if (!detail.items) detail.items = [];
    if (!detail.history) detail.history = [];
    renderContractDetailView(detail);
  } catch (e) {
    if (requestToken !== contractDetailRequestToken) return;
    msg.textContent = '오류: ' + e.message;
  }
}

async function saveContractDraft(id) {
  if (contractBusy) return;
  if (!currentContractDetail || (currentContractDetail.contract || currentContractDetail).status !== 'DRAFT') {
    msg.textContent = '오류: DRAFT 상태만 수정할 수 있습니다.';
    return;
  }
  contractBusy = true;
  try {
    const meta = readContractMetaForm('ctr-edit');
    const items = readContractItemsFromDom();
    const amount = items.reduce((sum, item) => sum + item.subtotal, 0);
    await api('PUT', '/care/contracts/' + id, { ...meta, amount, items });
    msg.textContent = '계약이 저장되었습니다.';
    await openContractDetail(id);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    contractBusy = false;
  }
}

async function updateContractStatus(id, newStatus, customerId) {
  if (contractBusy) return;
  if (newStatus === 'CANCELLED') {
    if (!confirm('이 계약을 취소할까요? 취소 후에는 되돌릴 수 없습니다.')) return;
  }
  contractBusy = true;
  const requestCustomerId = customerId == null || customerId === ''
    ? null
    : Number(customerId);
  try {
    await api('PUT', '/care/contracts/' + id + '/status', { status: newStatus });
    msg.textContent = '상태가 변경되었습니다.';
    if (requestCustomerId != null && Number.isFinite(requestCustomerId)) {
      // 고객 상세에서 전이: 다른 고객으로 이미 이동했으면 화면을 덮어쓰지 않는다.
      // viewCustomer의 requestToken이 추가 stale 응답도 버린다.
      if (Number(currentCustomerId) !== requestCustomerId) return;
      await viewCustomer(requestCustomerId, 'contracts');
    } else {
      await openContractDetail(id);
    }
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  } finally {
    contractBusy = false;
  }
}

async function openSiteChecklist(siteId) {
  if (!currentCustomerDetail) return;
  const host = document.querySelector('#site-checklist-host');
  const site = currentCustomerDetail.sites.find(item => Number(item.id) === Number(siteId));
  if (!host || !site) return;
  const requestToken = ++siteChecklistRequestToken;
  host.innerHTML = '<div class="site-checklist-shell"><p style="margin:0;">체크리스트를 불러오는 중...</p></div>';
  host.scrollIntoView({ behavior:'smooth', block:'start' });
  try {
    const res = await api('GET', '/care/site-checklists?site_id=' + encodeURIComponent(siteId));
    if (requestToken !== siteChecklistRequestToken) return;
    host.innerHTML = renderSiteChecklistEditor(site, res.data || []);
  } catch (e) {
    if (requestToken !== siteChecklistRequestToken) return;
    host.innerHTML = `<div class="site-checklist-shell">${emptyState('불러오지 못했습니다', e.message)}</div>`;
  }
}

function closeSiteChecklist() {
  siteChecklistRequestToken++;
  const host = document.querySelector('#site-checklist-host');
  if (host) host.innerHTML = '';
}

async function saveSiteChecklist(siteId) {
  const inspector = document.querySelector('#checklist-inspector').value.trim();
  if (!inspector) {
    msg.textContent = '오류: 점검자 이름을 입력하세요.';
    document.querySelector('#checklist-inspector').focus();
    return;
  }
  const items = SITE_CHECKLIST_ITEMS.map(([code]) => ({
    item_code: code,
    result: document.querySelector('#checklist-result-' + code).value,
    note: document.querySelector('#checklist-note-' + code).value.trim(),
  }));
  try {
    await api('POST', '/care/site-checklists', {
      site_id: siteId,
      inspected_on: document.querySelector('#checklist-inspected-on').value,
      inspector,
      notes: document.querySelector('#checklist-notes').value.trim(),
      items,
    });
    msg.textContent = '주소별 점검 체크리스트가 저장되었습니다.';
    await openSiteChecklist(siteId);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
}

async function viewCustomer(id, selectedTab) {
  msg.textContent = '불러오는 중...';
  // 요청 identity guard: 응답을 받을 때 여전히 최신 조회 요청인지 토큰으로 확인해
  // 고객 A 조회 중 고객 B로 빠르게 이동해도 늦게 도착한 A 응답이 B 화면을 덮지 않게 한다.
  const requestToken = ++customerDetailRequestToken;
  try {
    const [customerRes, consultationsRes, timelineRes, sitesRes, equipmentRes, quotesRes, contractsRes, ticketsRes, salesRes, contactsRes, tasksRes, followupsRes, carePlansRes] = await Promise.all([
      api('GET', '/care/customers/' + id),
      api('GET', '/care/consultations?customer_id=' + id),
      api('GET', '/care/timeline?customer_id=' + id + '&type=ALL'),
      api('GET', '/care/sites?customer_id=' + id),
      api('GET', '/care/equipment?customer_id=' + id),
      api('GET', '/care/quotes?customer_id=' + id),
      api('GET', '/care/contracts?customer_id=' + id),
      api('GET', '/care/tickets?customer_id=' + id),
      api('GET', '/care/part-sales?customer_id=' + id),
      api('GET', '/care/customer-contacts?customer_id=' + id),
      api('GET', '/care/customer-tasks?customer_id=' + id),
      api('GET', '/care/customer-followups?customer_id=' + id),
      api('GET', '/care/care-plans?customer_id=' + id)
    ]);
    if (requestToken !== customerDetailRequestToken) return;
    msg.textContent = '';
    currentCustomerId = id;
    currentCustomerTab = selectedTab || 'basic';
    currentTimelineType = 'ALL';
    currentCustomerDetail = {
      customer: customerRes.data,
      consultations: consultationsRes.data,
      timeline: timelineRes.data,
      sites: sitesRes.data,
      equipment: equipmentRes.data,
      quotes: quotesRes.data,
      contracts: contractsRes.data,
      tickets: ticketsRes.data,
      sales: salesRes.data,
      contacts: contactsRes.data,
      tasks: tasksRes.data,
      followups: followupsRes.data,
      carePlans: carePlansRes.data
    };
    renderCustomerDetail();
  } catch (e) {
    if (requestToken !== customerDetailRequestToken) return;
    msg.textContent = '오류: ' + e.message;
  }
}

async function setCustomerTimelineType(type) {
  if (!currentCustomerId || !currentCustomerDetail) return;
  const requestToken = ++customerTimelineRequestToken;
  const requestCustomerId = currentCustomerId;
  try {
    const res = await api('GET', '/care/timeline?customer_id=' + currentCustomerId + '&type=' + encodeURIComponent(type));
    if (requestToken !== customerTimelineRequestToken) return;
    if (requestCustomerId !== currentCustomerId) return;
    currentTimelineType = type;
    currentCustomerDetail.timeline = res.data;
    renderCustomerDetail();
  } catch (e) {
    if (requestToken !== customerTimelineRequestToken) return;
    msg.textContent = '오류: ' + e.message;
  }
}

// 표시 전용 배너: 현장의 연간관리 이용 현황을 안내만 하며, 할인/과금/방문
// 자동차감·접수 차단은 절대 하지 않는다. 요청 토큰으로 site_id를 빠르게
// 바꿔도 늦게 도착한 이전 응답이 배너를 덮어쓰지 않게 막는다.
async function refreshTicketCarePlanBanner(siteIdRaw) {
  const requestToken = ++ticketCarePlanRequestToken;
  const banner = document.querySelector('#ticketCarePlanBanner');
  if (!banner) return;
  const siteId = Number(siteIdRaw);
  if (!siteIdRaw || !Number.isFinite(siteId) || siteId <= 0) {
    banner.style.display = 'none';
    banner.innerHTML = '';
    return;
  }
  banner.style.display = '';
  banner.textContent = '연간관리 확인 중...';
  try {
    const res = await api('GET', '/care/care-plans?site_id=' + siteId);
    if (requestToken !== ticketCarePlanRequestToken) return;
    const freshBanner = document.querySelector('#ticketCarePlanBanner');
    if (!freshBanner) return;
    const active = (res.data || []).find(p => carePlanEffectiveStatus(p) === 'ACTIVE');
    if (active) {
      freshBanner.innerHTML = `연간관리 이용 중 — ${escapeHtml(carePlanCodeLabel(active.plan_code))} · 잔여 ${escapeHtml(String(carePlanRemainingVisits(active)))}회 · ~${escapeHtml(active.ends_at || '-')}`;
    } else {
      freshBanner.textContent = '연간관리 미가입';
    }
  } catch (e) {
    if (requestToken !== ticketCarePlanRequestToken) return;
    const freshBanner = document.querySelector('#ticketCarePlanBanner');
    if (freshBanner) freshBanner.textContent = '연간관리 확인 실패: ' + e.message;
  }
}

function opsListCapNote(section) {
  const count = Number(section && section.count || 0);

  if (count > shown) {
    return ` <span style="color:#8B979B; font-size:12.5px; font-weight:500;">(목록 ${shown}건만 표시)</span>`;
  }
  return '';
}

async function copyTextFromSelector(selector) {
  const target = document.querySelector(selector);
  if (!target) {
    msg.textContent = '오류: 복사 대상 요소를 찾지 못했습니다.';
    return;
  }
  try {
    await navigator.clipboard.writeText(target.textContent || '');
    msg.textContent = '복사되었습니다.';
  } catch (e) {
    msg.textContent = '오류: 복사에 실패했습니다.';
  }
}

document.addEventListener('click', async (event) => {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  if (actionEl.dataset.stopPropagation === '1') event.stopPropagation();
  event.preventDefault();

  let args = [];
  try {
    args = actionEl.dataset.args ? JSON.parse(actionEl.dataset.args) : [];
  } catch (e) {
    msg.textContent = '오류: action args 파싱에 실패했습니다.';
    return;
  }

  const fn = globalThis[actionEl.dataset.action];
  if (typeof fn !== 'function') {
    msg.textContent = '오류: action handler를 찾지 못했습니다.';
    return;
  }

  try {
    await fn(...args);
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
});

    }
  });
});
